<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<title>Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Thème noir unique (indépendant du réglage du téléphone). */
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --surface: #15181d;
    --surface-2: #1c2027;
    --surface-3: #242932;
    --line: #262b33;
    --line-2: #323844;
    --text: #e9ebee;
    --text-2: #b4bac4;
    --muted: #7d8592;
    --accent: #4c8dff;
    --accent-soft: rgba(76, 141, 255, .14);
    --pos: #3fbf7f;
    --neg: #f2706b;
    --warn: #f0b429;
    /* statuts (graphiques / conseils) */
    --st-good: #0ca30c;
    --st-warn: #fab219;
    --st-serious: #ec835a;
    --st-critical: #d03b3b;
    /* séries catégorielles (palette validée sur fond sombre) */
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; }
  body { padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.01em; }
  .muted { color: var(--muted); }
  .t2 { color: var(--text-2); }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .small { font-size: 13px; }
  .xs { font-size: 12px; }
  code { font-size: 12px; background: var(--surface-3); padding: 1px 5px; border-radius: 5px; color: var(--text-2); }
  svg.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* En-tête */
  header { position: sticky; top: 0; z-index: 10; background: rgba(11, 13, 16, .92); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
    padding: calc(8px + env(safe-area-inset-top)) 8px 8px; display: flex; align-items: center; gap: 4px; }
  header .month { flex: 1; text-align: center; min-width: 0; }
  header .month b { display: block; font-size: 16px; font-weight: 600; text-transform: capitalize; letter-spacing: -.01em; }
  header .month span { font-size: 11px; color: var(--muted); }
  header button { background: transparent; border: 0; color: var(--text-2); width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
    display: grid; place-items: center; }
  header button:active { background: var(--surface-2); }
  header button[hidden] { display: grid; visibility: hidden; }

  main { max-width: 760px; margin: 0 auto; padding: 14px 14px 28px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
  .card h2, .h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .backbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .backbar h1 { font-size: 20px; margin: 0; flex: 1; font-weight: 600; letter-spacing: -.02em; }

  .hero { padding: 20px 16px; }
  .hero .label { color: var(--muted); font-size: 13px; }
  .hero .big { font-size: 36px; font-weight: 700; margin: 4px 0 12px; letter-spacing: -.03em; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: var(--surface-2); border-radius: 10px; padding: 9px 10px; min-width: 0; }
  .kpi .k { font-size: 11px; color: var(--muted); }
  .kpi .v { font-weight: 600; font-size: 14px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 3px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  th { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
  td.pc { font-size: 11px; color: var(--muted); }
  tr.grp td { font-weight: 600; color: var(--text); }
  tr.sub td { color: var(--text-2); }
  tr.sub td:first-child { padding-left: 12px; }
  tr.click { cursor: pointer; }
  tr.click:active td { background: var(--surface-2); }
  tr.total td { font-weight: 700; border-bottom: 0; padding-top: 10px; }

  .bar { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; margin-top: 7px; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .bar > span.over { background: var(--neg); }
  .prog { margin-bottom: 14px; }
  .prog:last-child { margin-bottom: 0; }
  .prog .top { display: flex; justify-content: space-between; gap: 8px; }

  .list { margin: 0; padding: 0; list-style: none; }
  .item { display: flex; align-items: center; gap: 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .item .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; margin-top: 2px; }
  .item .amt { text-align: right; font-weight: 600; }
  .item.off { opacity: .45; }
  .emo { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 18px; flex: none; }
  .day { font-size: 12px; font-weight: 500; color: var(--muted); padding: 14px 2px 2px; text-transform: capitalize; }
  .day:first-child { padding-top: 0; }
  .who { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-2); line-height: 18px; }
  .who i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .tag { font-size: 11px; background: var(--surface-3); color: var(--text-2); padding: 0 7px; border-radius: 6px; line-height: 19px; white-space: nowrap; }
  .tag.acc { background: var(--accent-soft); color: var(--accent); }
  .tag.warn { background: rgba(240, 180, 41, .12); color: var(--warn); }
  .tag.neg { background: rgba(242, 112, 107, .12); color: var(--neg); }

  .sec-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 8px; }
  .sec-head h2 { margin: 0; }
  .check { width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid var(--line-2); background: transparent;
    display: grid; place-items: center; flex: none; cursor: pointer; padding: 0; color: #0b0d10; }
  .check svg { width: 15px; height: 15px; stroke-width: 3; }
  .check.on { background: var(--pos); border-color: var(--pos); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line-2); background: transparent; color: var(--text-2); padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 13.5px; }
  .chip.on { background: var(--text); border-color: var(--text); color: #0b0d10; font-weight: 500; }
  .chip.add { border-style: dashed; color: var(--accent); }
  .filters { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters .chip { white-space: nowrap; }
  .seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 9px; cursor: pointer; font-weight: 500; color: var(--muted); font-size: 14px; }
  .seg button.on { background: var(--surface-3); color: var(--text); }
  .seg button.on.s { color: var(--neg); } .seg button.on.e { color: var(--pos); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px;
    padding: 12px 16px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; font-size: 15px; }
  .btn.ghost { background: var(--surface-3); color: var(--text); }
  .btn.danger { background: transparent; color: var(--neg); }
  .btn.sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 6px 0; font-weight: 500; font-size: 14px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(11, 13, 16, .94); backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: transparent; padding: 9px 0 8px; font-size: 10.5px; color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav button.on { color: var(--text); }
  nav button.on svg { color: var(--accent); }
  .fab { position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 21; width: 56px; height: 56px;
    border-radius: 18px; border: 0; background: var(--accent); color: #fff; box-shadow: 0 8px 24px rgba(76, 141, 255, .35);
    cursor: pointer; display: grid; place-items: center; }
  .fab svg { width: 26px; height: 26px; stroke-width: 2.2; }

  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--surface); border: 1px solid var(--line); border-bottom: 0; width: 100%; max-width: 560px; max-height: 92vh;
    overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); animation: up .18s ease-out; }
  .sheet::before { content: ""; display: block; width: 38px; height: 4px; border-radius: 2px; background: var(--line-2); margin: -8px auto 12px; }
  @media (min-width: 600px) { .overlay { align-items: center; } .sheet { border-radius: 20px; border-bottom: 1px solid var(--line); } .sheet::before { display: none; } }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .field { margin-bottom: 12px; }
  .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  input, select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--accent); transform: scale(1.15); margin: 0 8px 0 2px; flex: none; }
  input[type=color] { padding: 2px; height: 42px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  input:disabled, select:disabled { opacity: .6; }
  input.amount { font-size: 30px; font-weight: 700; text-align: center; letter-spacing: -.02em; background: transparent; border-color: var(--line); }
  .quick { position: relative; margin-bottom: 12px; }
  .quick input { padding-left: 40px; background: var(--accent-soft); border-color: transparent; }
  .quick svg { position: absolute; left: 12px; top: 11px; width: 20px; height: 20px; color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { display: flex; align-items: center; padding: 6px 0; cursor: pointer; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; background: var(--surface-2); }
  .info { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; color: var(--text-2); }
  .info b { color: var(--text); }
  .actions { display: flex; gap: 10px; margin-top: 8px; }
  .actions .btn:last-child { flex: 1; }
  .foot { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: center; }
  .emojis { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-bottom: 8px; }
  .emojis button { background: var(--surface-2); border: 1px solid transparent; border-radius: 8px; font-size: 19px; padding: 5px 0; cursor: pointer; }
  .emojis button.on { border-color: var(--accent); background: var(--accent-soft); }

  .empty { text-align: center; padding: 28px 10px; color: var(--muted); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(146px + env(safe-area-inset-bottom)); z-index: 60;
    background: var(--surface-3); border: 1px solid var(--line-2); color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 14px;
    max-width: 90vw; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); }
  .toast.err { background: #3a1716; border-color: #6b2725; color: #ffd5d2; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 100; color: var(--muted); padding: 20px; text-align: center; }
  .spin { width: 30px; height: 30px; border: 2.5px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync { position: fixed; top: calc(66px + env(safe-area-inset-top)); right: 12px; z-index: 30; font-size: 11px;
    color: var(--text-2); display: flex; align-items: center; gap: 6px; pointer-events: none; background: var(--surface-3);
    border: 1px solid var(--line-2); padding: 4px 10px; border-radius: 999px; }
  .sync[hidden] { display: none; }
  .sync .spin { width: 10px; height: 10px; border-width: 1.5px; margin: 0; }

  /* Graphiques */
  .viz { --surface-1: var(--surface); }
  .donut-wrap { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .donut-wrap .legend { min-width: 200px; }
  .donut-wrap svg { flex: none; }
  .legend { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
  .legend .lg { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; border-radius: 8px; padding: 2px 4px; }
  .legend .lg.dim { opacity: .4; }
  .legend .lg .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .hbar { margin-bottom: 12px; cursor: pointer; }
  .hbar .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .hbar .track { position: relative; height: 10px; margin-top: 6px; }
  .hbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); border-radius: 0 4px 4px 0; }
  .hbar .fill.over { background: var(--st-critical); }
  .hbar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); border-radius: 1px; }
  .hbar .base { position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--surface-3); }
  .stack { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding-top: 8px; border-bottom: 1px solid var(--line); }
  .stack .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; cursor: pointer; min-width: 0; }
  .stack .col .segs { width: 70%; max-width: 30px; display: flex; flex-direction: column-reverse; gap: 2px; }
  .stack .col .segs span { display: block; width: 100%; }
  .stack .col .segs span:last-child { border-radius: 4px 4px 0 0; }
  .stack .col .inc { position: absolute; left: 8%; right: 8%; height: 2px; background: var(--text); border-radius: 1px; }
  .stack .col.sel .segs { outline: 2px solid var(--line-2); outline-offset: 2px; }
  .xlab { display: flex; gap: 6px; margin-top: 6px; }
  .xlab span { flex: 1; text-align: center; font-size: 10.5px; color: var(--muted); text-transform: capitalize; min-width: 0; overflow: hidden; }
  .tip { margin-top: 10px; background: var(--surface-2); border-radius: 10px; padding: 9px 12px; font-size: 13px; color: var(--text-2); }
  .tip b { color: var(--text); }

  /* Conseils */
  .gauge { margin-bottom: 16px; }
  .gauge:last-child { margin-bottom: 0; }
  .gauge .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .gauge .track { position: relative; height: 8px; background: var(--surface-3); border-radius: 4px; margin: 8px 0 6px; }
  .gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
  .gauge .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); }
  .status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .status.good { color: var(--st-good); } .status.warn { color: var(--st-warn); } .status.bad { color: var(--st-serious); }
  .advice { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; color: var(--text-2); }
  .advice:last-child { border-bottom: 0; }
  .advice .i { flex: none; width: 22px; text-align: center; }
  .jr { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .jr .h { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .swatches button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .swatches button.on { border-color: var(--text); }
</style>
</head>
<body>
<div class="loading" id="loading"><div><div class="spin"></div>Chargement…</div></div>

<header>
  <button data-act="prevMonth" id="prevBtn" aria-label="Mois précédent"><svg class="ic" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="month"><b id="monthLabel"></b><span id="versionLabel"></span></div>
  <button data-act="nextMonth" id="nextBtn" aria-label="Mois suivant"><svg class="ic" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <button data-act="refresh" aria-label="Actualiser"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
</header>
<div class="sync" id="sync" hidden><div class="spin"></div><span>Enregistrement…</span></div>

<main id="view"></main>

<button class="fab" id="fab" data-act="newMvt" aria-label="Ajouter un mouvement"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="nav"></nav>

<script>
/* ================================================================== */
/* État & utilitaires                                                  */
/* ================================================================== */
var D = null;
var tab = 'synthese';
var sub = '';
var mois = ymNow();
var mvtFilter = 'tous';
var synSeg = 'resume';
var vizPeriod = 1;
var advBasis = 1;
var fixSort = lsGet('budget.fixSort') || 'libelle';
var fixDir = lsGet('budget.fixDir') || 'desc';
var lastLoad = 0;
var pending = 0;
var dirty = false;
var ensured = {};
var journalCache = null;
var backupsCache = null;
var form = {};
var vizSel = null;

var ROLE_LABEL = { admin: 'Administrateur', editeur: 'Éditeur', lecteur: 'Lecteur' };
var COLORS = ['#4c8dff', '#e5679b', '#3fbf7f', '#f0b429', '#9085e9', '#ec835a', '#2bb3c0', '#b4bac4'];
var ICONS = {
  'Salaires': '💼', 'Entrées exceptionnelles': '🎁', 'Remboursements médicaux': '🩺', 'Remboursements divers': '↩️',
  'Carburant': '⛽', 'Prêt auto': '🚗', 'Prêt maison': '🏠', 'Crédit conso': '💳', 'Alimentaire': '🛒', 'Divers': '📦',
  'Resto': '🍽️', 'Loisirs': '🎉', 'Voyage / Vacances': '✈️', 'Electricité': '⚡', 'Eau': '💧', 'Impôts': '🏛️',
  'Abonnements': '📱', 'Epargne': '🐷', 'Scolarité': '🎒', 'Assurances': '🛡️'
};
var EMOJIS = ('🛒 🍽️ ☕ 🥖 🍕 🍷 ⛽ 🚗 🚌 🅿️ 🔧 🏠 🛋️ 🔨 ⚡ 💧 🔥 📱 💻 📺 🎮 🎵 📚 🎒 🎓 👶 🧸 🐶 🐱 💊 🩺 🦷 👓 💇 👕 👟 🎁 🎉 🎬 ⚽ 🚴 🏋️ 🧘 ✈️ 🏖️ ⛷️ 🏛️ 🧾 🛡️ 💳 🏦 🐷 💰 💼 📦 ↩️ ❤️ 🌱 🎄').split(' ');
var TYPES = {
  besoin: { label: 'Besoins', color: 'var(--s1)' },
  envie: { label: 'Envies', color: 'var(--s2)' },
  credit: { label: 'Crédits', color: 'var(--s3)' },
  epargne: { label: 'Épargne', color: 'var(--s4)' }
};

/* ================================================================== */
/* Serveur                                                             */
/* ================================================================== */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  pending++; syncUi();
  return new Promise(function (resolve, reject) {
    var r = google.script.run
      .withSuccessHandler(function (x) { done(); resolve(x); })
      .withFailureHandler(function (e) { done(); toast((e && e.message) || String(e), true); reject(e); });
    r[fn].apply(r, args);
  });
  function done() { pending--; syncUi(); }
}
function syncUi() { document.getElementById('sync').hidden = !pending; }
function write(fn) { return call.apply(null, arguments).then(function (x) { dirty = true; return x; }); }

/**
 * Enregistrement en arrière-plan : l'écran est déjà à jour, les envois partent dans l'ordre.
 * En cas d'échec, les données sont rechargées depuis la Google Sheet.
 */
var queue = Promise.resolve();
function bg(fn, args, onOk) {
  queue = queue.then(function () {
    return write.apply(null, [fn].concat(args)).then(function (r) { if (onOk) onOk(r); });
  }).catch(function () { return load(); });
  return queue;
}

function load() {
  return call('getAll').then(function (data) {
    setData(data);
    document.getElementById('loading').style.display = 'none';
    render();
    ensureMonthClient();
  }, function (e) {
    document.getElementById('loading').innerHTML = '<div>' + esc((e && e.message) || 'Impossible de charger les données.') +
      '<br><br><button class="btn" onclick="location.reload()">Réessayer</button></div>';
    document.getElementById('loading').style.display = 'grid';
  });
}
function setData(data) {
  D = data; lastLoad = Date.now(); ensured = {};
  document.getElementById('versionLabel').textContent = 'v' + D.version + (D.stage ? ' · ' + D.stage : '');
  document.getElementById('fab').hidden = !canEdit();
}

function ensureMonthClient() {
  if (!canEdit() || ensured[mois]) return;
  var m = mois;
  var missing = D.recurrents.some(function (r) {
    return r.actif && r.debut <= m && (!r.fin || r.fin >= m) &&
      !D.mouvements.some(function (x) { return x.recurrentId === r.id && x.mois === m; });
  });
  ensured[m] = true;
  if (!missing) return;
  write('ensureMonth', m).then(function (rows) {
    rows.forEach(function (r) { D.mouvements.push(r); });
    if (rows.length) { render(); toast(rows.length + ' mouvement(s) fixe(s) reporté(s)'); }
  });
}

/* ================================================================== */
/* Calculs                                                             */
/* ================================================================== */
function envInfo(libId, m) {
  var override = null, def = null;
  (D.enveloppes || []).forEach(function (e) {
    if (e.libelleId !== libId) return;
    if (e.portee === 'mois' && e.debut === m) override = e;
    if (e.portee !== 'mois' && e.debut <= m && (!def || e.debut > def.debut)) def = e;
  });
  var src = override || def;
  return { montant: src ? Number(src.montant) || 0 : 0, src: src, ajuste: !!override };
}
function envFor(libId, m) { return envInfo(libId, m).montant; }

function compute(m) {
  var mv = D.mouvements.filter(function (x) { return x.mois === m && x.statut !== 'annule'; });
  var per = {};
  D.libelles.forEach(function (l) { per[l.id] = { lib: l, env: envFor(l.id, m), fixes: 0, prevu: 0, reel: 0, n: 0 }; });
  mv.forEach(function (x) {
    var p = per[x.libelleId] || (per[x.libelleId] = { lib: lib(x.libelleId), env: 0, fixes: 0, prevu: 0, reel: 0, n: 0 });
    p.reel += Number(x.montant) || 0;
    p.n++;
    if (x.recurrentId) p.fixes += Number(x.prevu) || 0;
  });
  // Prévu = enveloppe / montant prévu si défini (elle inclut les fixes), sinon la somme des fixes prévus.
  Object.keys(per).forEach(function (k) { var p = per[k]; p.prevu = p.env > 0 ? p.env : p.fixes; });
  var tot = { entree: { prevu: 0, reel: 0 }, sortie: { prevu: 0, reel: 0 } };
  var groups = {}, types = { besoin: 0, envie: 0, credit: 0, epargne: 0 };
  Object.keys(per).forEach(function (k) {
    var p = per[k];
    if (!p.prevu && !p.reel && !p.lib.actif) return;
    var s = p.lib.sens;
    tot[s].prevu += p.prevu; tot[s].reel += p.reel;
    if (s === 'sortie') types[ltype(p.lib)] = (types[ltype(p.lib)] || 0) + p.reel;
    var gk = s + '|' + p.lib.groupe;
    if (!groups[gk]) groups[gk] = { sens: s, nom: p.lib.groupe, prevu: 0, reel: 0, libs: [] };
    groups[gk].prevu += p.prevu; groups[gk].reel += p.reel; groups[gk].libs.push(p);
  });
  return {
    mv: mv, per: per, tot: tot, groups: groups, types: types,
    bilan: { prevu: tot.entree.prevu - tot.sortie.prevu, reel: tot.entree.reel - tot.sortie.reel },
    todo: mv.filter(function (x) { return !x.pointe; }).length
  };
}

/** Agrège plusieurs mois (graphiques, conseils). */
function computeRange(m, n) {
  var agg = { per: {}, types: { besoin: 0, envie: 0, credit: 0, epargne: 0 }, entrees: 0, sorties: 0, n: n };
  for (var k = 0; k < n; k++) {
    var c = compute(shiftMonth(m, -k));
    agg.entrees += c.tot.entree.reel; agg.sorties += c.tot.sortie.reel;
    Object.keys(c.types).forEach(function (t) { agg.types[t] = (agg.types[t] || 0) + c.types[t]; });
    Object.keys(c.per).forEach(function (id) {
      var p = c.per[id];
      var a = agg.per[id] || (agg.per[id] = { lib: p.lib, reel: 0, prevu: 0 });
      a.reel += p.reel; a.prevu += p.prevu;
    });
  }
  return agg;
}

  document.getElementById('monthLabel').textContent = tab === 'fixes' ? 'Mouvements fixes' : tab === 'plus' ? 'Plus' : monthName(mois);
  document.getElementById('prevBtn').hidden = monthless;
  document.getElementById('nextBtn').hidden = monthless;
  document.getElementById('nav').innerHTML = TABS.map(function (t) {
    return '<button data-act="tab" data-tab="' + t[0] + '" class="' + (tab === t[0] ? 'on' : '') + '">' + svg(t[0]) + t[1] + '</button>';
  }).join('');
  var c = compute(mois);
  var v = tab === 'plus' && sub ? SUBVIEWS[sub] : { synthese: viewSynthese, mouvements: viewMouvements, enveloppes: viewEnveloppes, fixes: viewFixes, plus: viewPlus }[tab];
  document.getElementById('view').innerHTML = v(c);
}

      '</td><td class="num">' + eur0(t.reel) + '</td><td class="pc">' + pct(t.reel / revR) + '</td></tr>';
  });
  h += '<tr class="total"><td>Reste à vivre</td><td class="num ' + (b.prevu < 0 ? 'neg' : 'pos') + '">' + eur0(b.prevu) + '</td><td class="pc">' + pct(b.prevu / revP) +

/* ---------------- Graphiques ---------------- */
function viewGraphs() {
  var n = vizPeriod, agg = computeRange(mois, n);
  var label = n === 1 ? monthName(mois) : n + ' derniers mois';
  var h = '<div class="chips filters">' + [[1, 'Mois'], [3, '3 mois'], [12, '12 mois']].map(function (p) {
    return '<button class="chip ' + (vizPeriod === p[0] ? 'on' : '') + '" data-act="vizPeriod" data-v="' + p[0] + '">' + p[1] + '</button>';
  }).join('') + '</div>';

  // 1. Répartition par type (anneau)
  var total = TYPE_ORDER.reduce(function (s, t) { return s + Math.max(0, agg.types[t] || 0); }, 0);
  h += '<div class="card viz"><h2>Répartition des sorties · ' + esc(label) + '</h2>';
  if (!total) {
    h += '<div class="empty">Aucune sortie sur la période.</div></div>';
  } else {
    var R = 54, C = 2 * Math.PI * R, off = 0, segs = '';
    TYPE_ORDER.forEach(function (t) {
      var v = Math.max(0, agg.types[t] || 0); if (!v) return;
      var len = v / total * C, gap = len > 4 ? 2 : 0;
      var dim = vizSel && vizSel !== t;
      segs += '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + TYPES[t].color + '" stroke-width="' + (vizSel === t ? 20 : 16) + '" ' +
        'stroke-dasharray="' + Math.max(0, len - gap) + ' ' + (C - len + gap) + '" stroke-dashoffset="' + (-off) + '" ' +
        'transform="rotate(-90 70 70)" opacity="' + (dim ? .35 : 1) + '" data-act="vizSel" data-v="' + t + '" style="cursor:pointer"><title>' +
        TYPES[t].label + ' : ' + eur(v) + '</title></circle>';
      off += len;
    });
    var focus = vizSel ? agg.types[vizSel] || 0 : total;
    h += '<div class="donut-wrap"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Répartition des sorties par type">' + segs +
      '<text x="70" y="66" text-anchor="middle" fill="var(--muted)" font-size="11">' + (vizSel ? TYPES[vizSel].label : 'Total') + '</text>' +
      '<text x="70" y="84" text-anchor="middle" fill="var(--text)" font-size="16" font-weight="700">' + esc(eur0(focus)) + '</text></svg><div class="legend">';
    TYPE_ORDER.forEach(function (t) {
      var v = Math.max(0, agg.types[t] || 0);
      h += '<div class="lg ' + (vizSel && vizSel !== t ? 'dim' : '') + '" data-act="vizSel" data-v="' + t + '"><span class="sw" style="background:' + TYPES[t].color + '"></span>' +
        '<span class="n">' + TYPES[t].label + '</span><span class="num small">' + eur0(v) + '</span><span class="num xs muted" style="width:44px;text-align:right">' + pct(v / total) + '</span></div>';
    });
    h += '</div></div>';
    if (agg.entrees) h += '<div class="tip">Sorties = <b>' + pct(agg.sorties / agg.entrees) + '</b> des entrées (' + eur0(agg.sorties) + ' / ' + eur0(agg.entrees) + ')</div>';
    h += '</div>';
  }

  // 2. Par libellé : réel vs enveloppe
  var rows = Object.keys(agg.per).map(function (k) { return agg.per[k]; })
    .filter(function (p) { return p.lib.sens === 'sortie' && (p.reel > 0 || p.prevu > 0) && (!vizSel || ltype(p.lib) === vizSel); })
    .sort(function (a, b) { return b.reel - a.reel; });
  h += '<div class="card viz"><div class="sec-head"><h2>Par libellé' + (vizSel ? ' · ' + TYPES[vizSel].label : '') + '</h2>' +
    (vizSel ? '<button class="link small" data-act="vizSel" data-v="">Tout afficher</button>' : '') + '</div>';
  if (!rows.length) h += '<div class="empty">Rien à afficher.</div>';
  var max = Math.max.apply(null, rows.map(function (p) { return Math.max(p.reel, p.prevu); }).concat([1]));
  rows.forEach(function (p) {
    var over = p.prevu > 0 && p.reel > p.prevu + 0.005;
    h += '<div class="hbar" data-act="openEnv" data-id="' + p.lib.id + '"><div class="top"><span>' + icon(p.lib) + ' ' + esc(p.lib.nom) + '</span>' +
      '<span class="num"><b>' + eur0(p.reel) + '</b>' + (p.prevu ? ' <span class="muted">/ ' + eur0(p.prevu) + '</span>' : '') +
      (over ? ' <span class="status bad">▲ dépassé</span>' : '') + '</span></div>' +
      '<div class="track"><span class="base"></span><span class="fill ' + (over ? 'over' : '') + '" style="width:' + (p.reel / max * 100) + '%"></span>' +
      (p.prevu ? '<span class="tick" style="left:calc(' + (p.prevu / max * 100) + '% - 1px)" title="Prévu"></span>' : '') + '</div></div>';
  });
  if (rows.length) h += '<div class="legend" style="flex-direction:row;gap:14px;margin-top:4px"><span class="lg"><span class="sw" style="background:var(--s1)"></span><span class="n">Réel</span></span>' +
    '<span class="lg"><span class="sw" style="background:var(--text);width:3px"></span><span class="n">Prévu / enveloppe</span></span>' +
    '<span class="lg"><span class="sw" style="background:var(--st-critical)"></span><span class="n">Dépassé</span></span></div>';
  h += '</div>';

  // 3. Évolution (barres empilées par type + repère des entrées)
  var nb = vizPeriod === 12 ? 12 : 6;
  var months = []; for (var k = nb - 1; k >= 0; k--) months.push(shiftMonth(mois, -k));
  var data = months.map(function (m) { var c = compute(m); return { m: m, types: c.types, e: c.tot.entree.reel, s: c.tot.sortie.reel, b: c.bilan.reel }; });
  var vmax = Math.max.apply(null, data.map(function (d) { return Math.max(d.e, d.s); }).concat([1]));
  h += '<div class="card viz"><h2>Évolution · ' + nb + ' mois</h2><div class="stack">';
  data.forEach(function (d) {
    var segsH = TYPE_ORDER.map(function (t) {
      var v = Math.max(0, d.types[t] || 0); if (!v) return '';
      return '<span style="height:' + (v / vmax * 150) + 'px;background:' + TYPES[t].color + '"></span>';
    }).join('');
    h += '<div class="col ' + (form.evoSel === d.m ? 'sel' : '') + '" data-act="evoSel" data-v="' + d.m + '"><div class="segs">' + segsH + '</div>' +
      (d.e ? '<span class="inc" style="bottom:' + (d.e / vmax * 150) + 'px" title="Entrées"></span>' : '') + '</div>';
  });
  h += '</div><div class="xlab">' + data.map(function (d) { return '<span>' + esc(monthName(d.m, true)) + '</span>'; }).join('') + '</div>';
  h += '<div class="legend" style="flex-direction:row;flex-wrap:wrap;gap:6px 14px;margin-top:10px">' + TYPE_ORDER.map(function (t) {
    return '<span class="lg"><span class="sw" style="background:' + TYPES[t].color + '"></span><span class="n">' + TYPES[t].label + '</span></span>';
  }).join('') + '<span class="lg"><span class="sw" style="background:var(--text);height:2px"></span><span class="n">Entrées</span></span></div>';
  var sel = data.filter(function (d) { return d.m === form.evoSel; })[0] || data[data.length - 1];
  h += '<div class="tip"><b style="text-transform:capitalize">' + esc(monthName(sel.m)) + '</b> · entrées <b class="pos">' + eur0(sel.e) + '</b> · sorties <b>' + eur0(sel.s) + '</b> · reste <b class="' + (sel.b < 0 ? 'neg' : '') + '">' + eur0(sel.b) + '</b><br>' +
    TYPE_ORDER.map(function (t) { return TYPES[t].label + ' ' + eur0(sel.types[t] || 0); }).join(' · ') + '</div>';
  h += '</div>';
  return h;
}

/* ---------------- Conseils ---------------- */
function statusOf(val, limit, isMin) {
  if (isMin) return val >= limit ? 'good' : val >= limit * 0.5 ? 'warn' : 'bad';
  return val <= limit ? 'good' : val <= limit * 1.1 ? 'warn' : 'bad';
}
var ST_LABEL = { good: '✓ Dans la norme', warn: '! À surveiller', bad: '✕ Hors repère' };
var ST_COLOR = { good: 'var(--st-good)', warn: 'var(--st-warn)', bad: 'var(--st-serious)' };
function gauge(title, val, limit, isMin, sub) {
  var st = statusOf(val, limit, isMin), scale = Math.max(limit * 1.6, val * 1.05, 1);
  return '<div class="gauge"><div class="top"><span>' + title + '</span><span><b class="num">' + pc1(val) + '</b> <span class="muted xs">' + (isMin ? '≥ ' : '≤ ') + limit + ' %</span></span></div>' +
    '<div class="track"><span class="fill" style="width:' + Math.min(100, val / scale * 100) + '%;background:' + ST_COLOR[st] + '"></span>' +
    '<span class="mark" style="left:' + (limit / scale * 100) + '%"></span></div>' +
    '<div style="display:flex;justify-content:space-between;gap:8px"><span class="status ' + st + '">' + ST_LABEL[st] + '</span><span class="xs muted">' + (sub || '') + '</span></div></div>';
}

function viewConseils() {
  var rp = reperes(), n = advBasis, agg = computeRange(mois, n);
  var rev = agg.entrees / n;
  var h = '<div class="chips filters">' + [[1, 'Ce mois'], [3, 'Moyenne 3 mois']].map(function (p) {
    return '<button class="chip ' + (advBasis === p[0] ? 'on' : '') + '" data-act="advBasis" data-v="' + p[0] + '">' + p[1] + '</button>';
  }).join('') + '</div>';
  if (!rev) {
    return h + '<div class="card empty">Aucune entrée sur la période : les pourcentages sont calculés par rapport à vos revenus.<br><br>' +
      'Saisissez vos salaires (de préférence en mouvement fixe) pour obtenir des conseils.</div>';
  }
  var t = {}; TYPE_ORDER.forEach(function (k) { t[k] = (agg.types[k] || 0) / n; });
  var p = function (v) { return v / rev * 100; };
  var besoins = p(t.besoin + t.credit), envies = p(t.envie), epargne = p(t.epargne), dette = p(t.credit);
  var logement = 0;
  Object.keys(agg.per).forEach(function (id) {
    var a = agg.per[id];
    if (rp.logementLibelles.some(function (nm) { return norm(nm) === norm(a.lib.nom); })) logement += a.reel / n;
  });
  var tips = [];
  var addTip = function (st, txt) { tips.push({ st: st, txt: txt }); };

  h += '<div class="card"><h2>Règle 50 / 30 / 20</h2>' +
    '<div class="xs muted" style="margin:-6px 0 14px">Revenus de référence : <b class="t2">' + eur0(rev) + '</b> / mois' + (n > 1 ? ' (moyenne)' : '') + '</div>' +
    gauge('🏠 Besoins (essentiels + crédits)', besoins, rp.besoins, false, eur0(t.besoin + t.credit) + ' / mois') +
    gauge('🎉 Envies', envies, rp.envies, false, eur0(t.envie) + ' / mois') +
    gauge('🐷 Épargne', epargne, rp.epargne, true, eur0(t.epargne) + ' / mois') + '</div>';

  h += '<div class="card"><h2>Endettement & logement</h2>' +
    gauge('💳 Taux d\'endettement', dette, rp.endettement, false, eur0(t.credit) + ' de crédits / mois') +
    gauge('🏠 Logement (' + esc(rp.logementLibelles.join(', ')) + ')', p(logement), rp.logement, false, eur0(logement) + ' / mois') + '</div>';

  var libRows = '';
  Object.keys(rp.libelles).forEach(function (nm) {
    var a = Object.keys(agg.per).map(function (id) { return agg.per[id]; }).filter(function (x) { return norm(x.lib.nom) === norm(nm); })[0];
    var v = a ? a.reel / n : 0;
    libRows += gauge(icon(a ? a.lib : { nom: nm }) + ' ' + esc(nm), p(v), rp.libelles[nm], false, eur0(v) + ' / mois');
    var st = statusOf(p(v), rp.libelles[nm], false);
    if (st !== 'good') addTip(st, '<b>' + esc(nm) + '</b> : ' + pc1(p(v)) + ' des revenus (repère ≤ ' + rp.libelles[nm] + ' %) — ' + eur0(v - rev * rp.libelles[nm] / 100) + ' au-dessus par mois.');
  });
  h += '<div class="card"><h2>Repères par libellé</h2>' + libRows + '</div>';

  if (statusOf(besoins, rp.besoins) !== 'good') addTip(statusOf(besoins, rp.besoins), '<b>Besoins</b> à ' + pc1(besoins) + ' (repère ≤ ' + rp.besoins + ' %) : renégocier assurances, abonnements, énergie ou crédits peut libérer ' + eur0((besoins - rp.besoins) / 100 * rev) + ' / mois.');
  if (statusOf(envies, rp.envies) !== 'good') addTip(statusOf(envies, rp.envies), '<b>Envies</b> à ' + pc1(envies) + ' (repère ≤ ' + rp.envies + ' %) : fixer des enveloppes Loisirs / Resto / Divers aide à réduire de ' + eur0((envies - rp.envies) / 100 * rev) + ' / mois.');
  if (statusOf(epargne, rp.epargne, true) !== 'good') addTip(statusOf(epargne, rp.epargne, true), '<b>Épargne</b> à ' + pc1(epargne) + ' : mettre de côté ' + eur0((rp.epargne - epargne) / 100 * rev) + ' de plus par mois pour atteindre ' + rp.epargne + ' %. Un virement fixe en début de mois facilite la régularité.');
  if (statusOf(dette, rp.endettement) !== 'good') addTip(statusOf(dette, rp.endettement), '<b>Endettement</b> à ' + pc1(dette) + ' : au-delà de ' + rp.endettement + ' %, les banques refusent en général un nouveau crédit. Évitez tout crédit supplémentaire.');
  if (statusOf(p(logement), rp.logement) !== 'good') addTip(statusOf(p(logement), rp.logement), '<b>Logement</b> à ' + pc1(p(logement)) + ' des revenus (repère ≤ ' + rp.logement + ' %).');
  var reste = rev - agg.sorties / n;
  if (reste < 0) addTip('bad', 'Les sorties dépassent les entrées de <b>' + eur0(-reste) + '</b> / mois sur la période.');

  h += '<div class="card"><h2>Conseils</h2>';
  if (!tips.length) h += '<div class="advice"><span class="i status good">✓</span><span>Tous les repères sont respectés. Pensez à augmenter l\'épargne si le reste à vivre le permet.</span></div>';
  tips.sort(function (a, b) { return (a.st === 'bad' ? 0 : 1) - (b.st === 'bad' ? 0 : 1); }).forEach(function (tp) {
    h += '<div class="advice"><span class="i status ' + tp.st + '">' + (tp.st === 'bad' ? '✕' : '!') + '</span><span>' + tp.txt + '</span></div>';
  });
  h += '</div><div class="foot">Repères indicatifs couramment utilisés (règle 50/30/20, taux d\'endettement de 35 % des banques françaises). ' +
    'Ce n\'est pas un conseil financier personnalisé.' + (isAdmin() ? '<br><button class="link small" data-act="openReperes">Modifier les repères</button>' : '') +
    '<br>Le type de chaque libellé (besoin, envie, crédit, épargne) se règle dans Plus › Libellés.</div>';
  return h;
}

function openReperes() {
  var rp = reperes();
  var h = '<h3>Repères budgétaires</h3><div class="info">En % des revenus du foyer.</div>';
  h += '<div class="row2">' + [['besoins', 'Besoins ≤'], ['envies', 'Envies ≤'], ['epargne', 'Épargne ≥'], ['endettement', 'Endettement ≤'], ['logement', 'Logement ≤']].map(function (f) {
    return '<div class="field"><label>' + f[1] + ' (%)</label><input id="rp_' + f[0] + '" inputmode="decimal" value="' + rp[f[0]] + '"></div>';
  }).join('') + '</div>';
  h += '<div class="field"><label>Libellés comptés dans le logement (séparés par des virgules)</label><input id="rp_logL" value="' + esc(rp.logementLibelles.join(', ')) + '"></div>';
  h += '<div class="field"><label>Repères par libellé (une ligne : Libellé = %)</label><textarea id="rp_libs" rows="6">' +
    esc(Object.keys(rp.libelles).map(function (k) { return k + ' = ' + rp.libelles[k]; }).join('\n')) + '</textarea></div>';
  h += '<div class="actions"><button class="btn ghost" data-act="resetReperes">Par défaut</button><button class="btn" id="saveBtn" data-act="saveReperes">Enregistrer</button></div>';
  openSheet(h);
}

/* ---------------- Mouvements ---------------- */
function mvtItem(x) {
  var l = lib(x.libelleId), entree = l.sens === 'entree';
  var chk = canEdit()
    ? '<button class="check ' + (x.pointe ? 'on' : '') + '" data-act="togglePointe" data-id="' + x.id + '" aria-label="Pointer">' + (x.pointe ? svg('check') : '') + '</button>'
    : '<span class="check ' + (x.pointe ? 'on' : '') + '">' + (x.pointe ? svg('check') : '') + '</span>';
  var meta = esc(l.nom) + ' · ' + whoBadge(x.saisiPar, x.saisiPar === 'auto' ? '' : '');
  if (x.recurrentId) meta += ' <span class="tag acc">fixe</span>';
  if (x.recurrentId && +x.montant === 0 && +x.prevu) meta += ' <span class="tag warn">non réalisé</span>';
  else if (x.recurrentId && x.modifie) meta += ' <span class="tag warn">modifié ce mois</span>';
  if (x.date.substring(0, 7) !== x.mois) meta += ' <span class="tag">↪ ' + esc(monthName(x.mois)) + '</span>';
  if (x.modifPar && x.modifPar !== x.saisiPar) meta += ' ' + whoBadge(x.modifPar, 'modifié par ');
  return '<li class="item" data-act="openMvt" data-id="' + x.id + '">' + chk + emo(l) +
    '<div class="main"><div class="title">' + esc(x.description || l.nom) + '</div><div class="meta">' + meta + '</div></div>' +
    '<div class="amt num ' + (entree ? 'pos' : '') + '">' + (entree ? '+' : '−') + eur(Math.abs(x.montant)).replace('-', '') + '</div></li>';
}

function viewMouvements(c) {
  var F = { tous: 'Tous', sortie: 'Sorties', entree: 'Entrées', fixes: 'Fixes', ponctuels: 'Ponctuels', apointer: 'À pointer' };
  var h = '<div class="chips filters">';
  Object.keys(F).forEach(function (k) {
    h += '<button class="chip ' + (mvtFilter === k ? 'on' : '') + '" data-act="mvtFilter" data-f="' + k + '">' + F[k] + (k === 'apointer' ? ' · ' + c.todo : '') + '</button>';
  });
  h += '</div>';
  var list = c.mv.filter(function (x) {
    var s = lib(x.libelleId).sens;
    return mvtFilter === 'tous' || mvtFilter === s || (mvtFilter === 'fixes' && x.recurrentId) ||
      (mvtFilter === 'ponctuels' && !x.recurrentId) || (mvtFilter === 'apointer' && !x.pointe);
  }).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.saisiLe < b.saisiLe ? 1 : -1); });
  var tE = 0, tS = 0;
  list.forEach(function (x) { if (lib(x.libelleId).sens === 'entree') tE += +x.montant; else tS += +x.montant; });
  h += '<div class="card"><div class="sec-head"><h2>' + list.length + ' mouvement' + (list.length > 1 ? 's' : '') + '</h2>' +
    '<span class="small num"><span class="pos">+' + eur(tE) + '</span> <span class="muted">·</span> −' + eur(tS) + '</span></div>';
  if (!list.length) {
    h += '<div class="empty">Aucun mouvement.' + (canEdit() ? '<br>Touchez <b>+</b> pour en ajouter un.' : '') + '</div>';
  } else {
    var day = '';
    list.forEach(function (x) {
      if (x.date !== day) { h += (day ? '</ul>' : '') + '<div class="day">' + esc(dayName(x.date)) + '</div><ul class="list">'; day = x.date; }
      h += mvtItem(x);
    });
    h += '</ul>';
  }
  var annules = D.mouvements.filter(function (x) { return x.mois === mois && x.statut === 'annule'; });
  if (annules.length && canEdit()) {
    h += '<div class="xs muted" style="margin-top:10px">Fixes retirés ce mois : ' + annules.map(function (x) {
      return esc(x.description || lib(x.libelleId).nom) + ' <button class="link xs" data-act="restoreOcc" data-id="' + x.id + '">rétablir</button>';
    }).join(' · ') + '</div>';
  }
  return h + '</div>';
}

/* ---------------- Enveloppes ---------------- */
function envProg(p) {
  var ratio = p.env > 0 ? p.reel / p.env : 0, reste = p.env - p.reel, entree = p.lib.sens === 'entree';
  var info = envInfo(p.lib.id, mois);
  var h = '<li class="item" data-act="openEnv" data-id="' + p.lib.id + '" style="display:block">' +
    '<div class="prog" style="margin:0"><div class="top"><span>' + icon(p.lib) + ' ' + esc(p.lib.nom) +
    (info.ajuste ? ' <span class="tag warn">ajusté ce mois</span>' : '') + '</span>';
  if (p.env > 0) {
    h += '<span class="num small"><b>' + eur(p.reel) + '</b> <span class="muted">/ ' + eur(p.env) + '</span></span></div>' +
      '<div class="bar"><span class="' + (!entree && ratio > 1 ? 'over' : '') + '" style="width:' + Math.min(100, ratio * 100) + '%"></span></div>' +
      '<div class="xs ' + (!entree && reste < 0 ? 'neg' : 'muted') + '" style="margin-top:4px">' +
      (entree ? (reste > 0 ? 'Encore ' + eur(reste) + ' attendus' : 'Objectif atteint') : (reste < 0 ? 'Dépassement de ' + eur(-reste) : 'Reste ' + eur(reste))) +
      (p.fixes ? ' · dont fixes ' + eur(p.fixes) : '') + '</div>';
  } else {
    h += '<span class="num small">' + (p.reel ? eur(p.reel) + ' ' : '') + '<span class="link xs">Définir</span></span></div>' +
      (p.fixes ? '<div class="xs muted" style="margin-top:2px">Fixes prévus : ' + eur(p.fixes) + '</div>' : '');
  }
  return h + '</div></li>';
}

function viewEnveloppes(c) {
  var envS = 0, prevS = 0;
  Object.keys(c.per).forEach(function (k) { var p = c.per[k]; if (p.lib.sens === 'sortie') { envS += p.env; prevS += p.prevu; } });
  var rest = c.tot.entree.prevu - prevS;
  var h = '<div class="card hero"><div class="label">Reste à répartir</div>' +
    '<div class="big num ' + (rest < 0 ? 'neg' : '') + '">' + eur(rest) + '</div>' +
    '<div class="kpis"><div class="kpi"><div class="k">Entrées prévues</div><div class="v num">' + eur0(c.tot.entree.prevu) + '</div></div>' +
    '<div class="kpi"><div class="k">Enveloppes</div><div class="v num">' + eur0(envS) + '</div></div>' +
    '<div class="kpi"><div class="k">Dépensé</div><div class="v num">' + eur0(c.tot.sortie.reel) + '</div></div></div></div>';
  h += '<div class="info">Chaque enveloppe est <b>reportée automatiquement</b> les mois suivants. Touchez un libellé pour la régler ' +
    'pour ce mois uniquement ou à partir de ce mois. Les fixes du libellé sont compris dans son enveloppe.</div>';
  ['sortie', 'entree'].forEach(function (sens) {
    groupsOf(sens).forEach(function (g) {
      var ps = libsSorted(sens).filter(function (l) { return l.groupe === g; }).map(function (l) { return c.per[l.id]; });
      var tE = ps.reduce(function (s, p) { return s + p.env; }, 0), tR = ps.reduce(function (s, p) { return s + p.reel; }, 0);
      h += '<div class="card"><div class="sec-head"><h2>' + esc(g) + '</h2>' +
        '<span class="small num"><b>' + eur0(tR) + '</b>' + (tE ? ' <span class="muted">/ ' + eur0(tE) + '</span>' : '') + '</span></div><ul class="list">';
      ps.forEach(function (p) { h += envProg(p); });
      h += '</ul></div>';
    });
  });
  return h;
}

function openEnv(libId) {
  var l = lib(libId), c = compute(mois), p = c.per[libId], info = envInfo(libId, mois), entree = l.sens === 'entree';
  var hist = [1, 2, 3].map(function (k) { var x = compute(shiftMonth(mois, -k)).per[libId]; return x ? x.reel : 0; });
  var moy = Math.round((hist[0] + hist[1] + hist[2]) / 3 * 100) / 100;
  var ro = !canEdit();
  var h = '<h3>' + icon(l) + ' ' + (entree ? 'Montant prévu' : 'Enveloppe') + ' · ' + esc(l.nom) + '</h3>';
  h += '<div class="info" style="text-transform:none"><span style="text-transform:capitalize">' + esc(monthName(mois)) + '</span> : ' +
    (p.env > 0 ? '<b>' + eur(p.env) + '</b>' + (info.ajuste ? ' (ajusté pour ce mois)' : (info.src && info.src.debut > '2000-01' ? ' (depuis ' + esc(monthName(info.src.debut)) + ')' : ''))
      : 'aucun montant prévu' + (p.fixes ? ' (fixes : ' + eur(p.fixes) + ')' : '')) +
    ' · ' + (entree ? 'reçu' : 'dépensé') + ' ' + eur(p.reel) + '</div>';
  if (entree && !p.fixes && !p.env) {
    h += '<div class="info">💡 Pour un salaire, le plus simple est d\'en faire un <b>mouvement fixe</b> (fiche du mouvement › « Rendre fixe ») : il sera prévu et reporté chaque mois automatiquement.</div>';
  }
  h += '<div class="field"><input id="v_amt" class="amount" inputmode="decimal" placeholder="0,00 €" value="' + (p.env > 0 ? amtInput(p.env) : '') + '"></div>';
  h += '<div class="chips" style="margin:-4px 0 12px">' +

function parseQuick(text) {
  var t = String(text || '').trim();
  if (!t) return null;
  var out = { montant: null, libelleId: '', sens: '', description: '' };
  var m = t.match(/(-?\d+(?:[.,]\d{1,2})?)\s*(?:€|euros?|eur\b)?(?:\s*(?:et\s*)?(\d{1,2})(?:\s*centimes?)?)?/i);
  var rest = t;
  if (m) {
    var v = parseFloat(m[1].replace(',', '.'));
    if (m[2] && !/[.,]/.test(m[1])) v += parseInt(m[2], 10) / 100;
    out.montant = Math.round(v * 100) / 100;
    rest = t.replace(m[0], ' ');
  }
  var n = ' ' + norm(rest).replace(/[^a-z0-9\/ ]/g, ' ') + ' ';
  if (/\b(recu|entree|rentree|virement recu|rembourse)\b/.test(n)) out.sens = 'entree';
  // 1. nom de libellé présent dans la phrase (le plus long gagne)
  var best = null;
  libsSorted().forEach(function (l) {
    var ln = norm(l.nom), stem = ln.replace(/s$/, '');
    if ((n.indexOf(' ' + ln + ' ') >= 0 || (stem.length > 3 && n.indexOf(' ' + stem) >= 0)) && (!best || ln.length > norm(best.nom).length)) best = l;
  });
  // 2. mots-clés usuels
  if (!best) {
    Object.keys(KEYWORDS).some(function (k) {
      var hit = KEYWORDS[k].some(function (w) { return n.indexOf(' ' + w) >= 0; });
      if (hit) best = libsSorted().filter(function (l) { return norm(l.nom) === k; })[0] || null;
      return !!best;
    });
  }
  // 3. descriptions déjà saisies
  if (!best && form.descs) {
    Object.keys(form.descs).some(function (d) {
      if (d.length > 2 && n.indexOf(' ' + norm(d)) >= 0) { best = byId(D.libelles, form.descs[d]); return true; }
      return false;
    });
  }
  if (best) { out.libelleId = best.id; out.sens = best.sens; }
  var words = rest.split(/\s+/).filter(function (w) {
    var nw = norm(w).replace(/[^a-z0-9]/g, '');
    if (!nw || STOP.indexOf(nw) >= 0 || STOP.indexOf(w.toLowerCase()) >= 0) return false;
    if (best && nw === norm(best.nom).replace(/[^a-z0-9]/g, '')) return false; // « alimentaire » retiré, « salaire » gardé
    return true;
  });
  out.description = words.join(' ').replace(/^\w/, function (c) { return c.toUpperCase(); });
  return out;
}

function refreshBudgetMonth() {
  var sel = document.getElementById('m_mois');
  if (!sel) return;
  var d = val('m_date');
  var dm = /^\d{4}-\d{2}/.test(d) ? d.substring(0, 7) : mois;
  var current = sel.value || form.moisInit;
  var choices = [shiftMonth(dm, -1), dm, shiftMonth(dm, 1)];
  if (current && choices.indexOf(current) < 0) choices.push(current);
  var def;
  if (form.moisTouched && current) def = current;
  else { var l = form.libelleId ? byId(D.libelles, form.libelleId) : null; def = l && l.moisSuivant ? shiftMonth(dm, 1) : dm; }
  sel.innerHTML = choices.map(function (m) {
    return '<option value="' + m + '" ' + (m === def ? 'selected' : '') + '>' + esc(monthName(m)) + (m === dm ? '' : m < dm ? ' (préc.)' : ' (suiv.)') + '</option>';
  }).join('');
}

function saveMvt(id, forceZero) {
  var x = id ? byId(D.mouvements, id) : null;
  var amt = forceZero ? 0 : parseAmount(val('m_amt'));
  var zeroOk = x && x.recurrentId;
  if (amt === null || (amt === 0 && !zeroOk)) return toast(zeroOk ? 'Montant manquant' : 'Montant manquant (0 € n\'est possible que pour un fixe)', true);
  if (!form.libelleId) return toast('Choisissez un libellé', true);
  var date = val('m_date');
  if (!date) return toast('Date manquante', true);
  var repeter = null;
  if (!id && checked('m_rep')) {
    try { repeter = { fin: readFin('m_') }; } catch (e) { return toast(e.message, true); }
  }
  var payload = { id: id || newCid(), date: date, mois: val('m_mois') || date.substring(0, 7), montant: amt, libelleId: form.libelleId, description: val('m_desc') };
  if (id) payload.pointe = checked('m_pointe');
  // Mise à jour immédiate de l'écran
  var local = JSON.parse(JSON.stringify(x || { recurrentId: '', prevu: '', pointe: false, modifie: false, statut: '', saisiPar: D.me.email, saisiLe: nowIso() }));
  ['id', 'date', 'mois', 'montant', 'libelleId', 'description'].forEach(function (k) { local[k] = payload[k]; });
  if (id) {
    local.pointe = payload.pointe; local.modifPar = D.me.email; local.modifLe = nowIso();
    if (x.recurrentId && (x.montant !== amt || x.date !== date || x.description !== payload.description || x.libelleId !== payload.libelleId)) local.modifie = true;
  }
  upsertLocal(D.mouvements, local);
  closeSheet();
  if (local.mois !== mois) { mois = local.mois; }
  render(); toast(repeter ? 'Mouvement fixe créé' : 'Enregistré');
  bg('saveMouvement', [payload, repeter], function (res) {
    upsertLocal(D.mouvements, res.mouvement);
    if (res.recurrent) D.recurrents.push(res.recurrent);
    render();
  });
}

  sub: function (d) { sub = d.sub; if (sub === 'journal') journalCache = null; if (sub === 'backups') backupsCache = null; render(); window.scrollTo(0, 0); },
  synSeg: function (d) { synSeg = d.v; vizSel = null; render(); },
  vizPeriod: function (d) { vizPeriod = +d.v; render(); },
  vizSel: function (d) { vizSel = d.v && vizSel !== d.v ? d.v : null; render(); },
  evoSel: function (d) { form.evoSel = d.v; render(); },
  advBasis: function (d) { advBasis = +d.v; render(); },
  openReperes: openReperes,
  saveReperes: function () {
    var rp = reperes();
    ['besoins', 'envies', 'epargne', 'endettement', 'logement'].forEach(function (k) { var v = parseAmount(val('rp_' + k)); if (v !== null) rp[k] = v; });
    rp.logementLibelles = val('rp_logL').split(',').map(function (s) { return s.trim(); }).filter(String);
    rp.libelles = {};
    val('rp_libs').split(/\n/).forEach(function (line) {
      var m = line.split('='); if (m.length < 2) return;
      var v = parseAmount(m[1]); if (m[0].trim() && v !== null) rp.libelles[m[0].trim()] = v;
    });
    busySave(write('saveReperes', rp)).then(function (json) { D.reperes = json; closeSheet(); render(); toast('Repères enregistrés'); });
  },
  resetReperes: function () {
    if (!confirm('Revenir aux repères par défaut ?')) return;
    write('saveReperes', {}).then(function (json) { D.reperes = json; closeSheet(); render(); });
  },
  prevMonth: function () { mois = shiftMonth(mois, -1); render(); ensureMonthClient(); },
  nextMonth: function () { mois = shiftMonth(mois, 1); render(); ensureMonthClient(); },
  refresh: function () { load().then(function () { toast('Données à jour'); }); },
  goFilter: function (d) { tab = 'mouvements'; mvtFilter = d.f; render(); },
  mvtFilter: function (d) { mvtFilter = d.f; render(); },
  close: closeSheet,
  newMvt: function () { openMvt(null); },
  openMvt: function (d) { openMvt(d.id); },
  saveMvt: function (d) { saveMvt(d.id); },
  delMvt: function (d) { delMvt(d.id); },
  dupMvt: function (d) { var x = byId(D.mouvements, d.id); openMvt(null, { libelleId: x.libelleId, montant: x.montant, description: x.description }); },
  nonRealise: function (d) {
    if (!confirm('Marquer ce fixe comme non réalisé pour ' + monthName(byId(D.mouvements, d.id).mois) + ' (0 €) ?')) return;
    saveMvt(d.id, true);
  },
  toggleNature: function () { var b = document.getElementById('natureBox'); b.hidden = !b.hidden; },
  toFixe: function (d) {
    var fin; try { fin = readFin('n_'); } catch (e) { return toast(e.message, true); }
    if (!confirm('Transformer ce mouvement en mouvement fixe ' + (fin ? 'jusqu\'à ' + monthName(fin) : 'perpétuel') + ' ?')) return;
    write('toFixe', d.id, fin).then(function (data) { setData(data); closeSheet(); render(); toast('Mouvement transformé en fixe'); });
  },
  toPonctuel: function (d) {
    if (!confirm('Rendre ce mouvement ponctuel ? Le fixe ne sera plus reporté les mois suivants.')) return;
    write('toPonctuel', d.id).then(function (data) { setData(data); closeSheet(); render(); toast('Mouvement rendu ponctuel'); });
  },
  setFin: function (d) {
    var x = byId(D.mouvements, d.id), r = x && byId(D.recurrents, x.recurrentId);
    var fin; try { fin = readFin('n_'); } catch (e) { return toast(e.message, true); }
    if (!r) return;
    var rec = JSON.parse(JSON.stringify(r)); rec.fin = fin; rec.actif = true;
    write('saveRecurrent', rec, x.mois).then(function (data) { setData(data); closeSheet(); render(); toast('Échéance enregistrée'); });
  },
  restoreOcc: function (d) { write('restoreOccurrence', d.id).then(function (m) { upsertLocal(D.mouvements, m); render(); toast('Rétabli'); }); },
  togglePointe: function (d) {
    var x = byId(D.mouvements, d.id); if (!x) return;
    x.pointe = !x.pointe; render();
    bg('setPointe', [d.id, x.pointe]);
  },
  setSens: function (d) {
    form.sens = d.sens; form.libelleId = '';
    Array.prototype.forEach.call(document.querySelectorAll('.sheet .seg button'), function (b) { b.classList.toggle('on', b.dataset.sens === d.sens); });
    document.getElementById('libWrap').innerHTML = libChips(form.sens, '');
  },
  pickLib: function (d) {
    form.libelleId = d.id;
    Array.prototype.forEach.call(document.querySelectorAll('#libChips .chip'), function (b) { b.classList.toggle('on', b.dataset.id === d.id); });
    if (form.kind === 'mvt') refreshBudgetMonth();
    if (form.kind === 'rec' && !form.id) { var c = document.getElementById('r_dec'); var l = byId(D.libelles, d.id); if (c && l) c.checked = !!l.moisSuivant; }
  },
  quickLib: function () {
    var nom = prompt('Nom du nouveau libellé (' + (form.sens === 'entree' ? 'entrée' : 'sortie') + ') :');
    if (!nom || !nom.trim()) return;
    var em = prompt('Emoji (facultatif) :', '') || '';
    write('saveLibelle', { nom: nom, sens: form.sens, groupe: form.sens === 'entree' ? 'Entrées' : 'Vie courante', emoji: em }).then(function (l) {
      D.libelles.push(l); form.libelleId = l.id;
      var w = document.getElementById('libWrap'); if (w) w.innerHTML = libChips(form.sens, l.id);
      toast('Libellé « ' + l.nom + ' » créé');
    });
  },
  pickEmoji: function (d) {
    form.emoji = d.v; document.getElementById('l_emoji').value = d.v;
    Array.prototype.forEach.call(document.querySelectorAll('#emojiGrid button'), function (b) { b.classList.toggle('on', b.dataset.v === d.v); });
  },
  toggleRep: function () { document.getElementById('repBox').hidden = !checked('m_rep'); },
  finMode: function (d, el) { var prefix = el.name.replace(/fin$/, ''); document.getElementById(prefix + 'finMois').hidden = el.value !== 'date'; },
  fixSort: function (d) {
    if (d.v === 'montant' && fixSort === 'montant') fixDir = fixDir === 'desc' ? 'asc' : 'desc';
    fixSort = d.v; lsSet('budget.fixSort', fixSort); lsSet('budget.fixDir', fixDir); render();
  },
  newRec: function (d) { openRec(null, d.sens); },
  openRec: function (d) { openRec(d.id); },
  saveRec: function (d) { saveRec(d.id); },
  stopRec: function (d) { stopRec(d.id); },
  dupRec: function (d) { var r = byId(D.recurrents, d.id); openRec(null, lib(r.libelleId).sens, { libelleId: r.libelleId, montant: r.montant, description: r.description, jour: r.jour, decalage: r.decalage }); },
  doImport: function () {
    var t = val('importTxt'); if (!t.trim()) return;
    write('importRecurrents', t).then(function (res) {
      setData(res.data); render();
      toast(res.count + ' importé(s)' + (res.skipped.length ? ', ' + res.skipped.length + ' ligne(s) ignorée(s)' : ''), !!res.skipped.length);
    });
  },
  openEnv: function (d) { openEnv(d.id); },
  saveEnv: function (d) { saveEnv(d.id); },
  delEnv: function (d) { if (confirm('Supprimer ce montant (selon le choix « Appliquer ») ?')) saveEnv(d.id, 0); },
  fillEnv: function (d) { document.getElementById('v_amt').value = amtInput(d.v); },
  openLib: function (d) { openLib(d.id); },
  saveLib: function (d) { saveLib(d.id); },
  delLib: function (d) { delLib(d.id); },
  openUser: function (d) { openUser(d.email); },
  saveUserForm: function (d) { saveUserForm(d.id); },
  pickColor: function (d) {
    form.couleur = d.c; document.getElementById('u_color').value = d.c;
    Array.prototype.forEach.call(document.querySelectorAll('#swatches button'), function (b) { b.classList.toggle('on', b.dataset.c === d.c); });
  },
  openAttente: function (d) { openAttente(d.id); },
  saveAttente: function (d) { saveAttenteForm(d.id); },
  delAttente: function (d) { write('deleteAttente', d.id).then(function () { removeLocal(D.attente, d.id); closeSheet(); render(); }); },
  openEpargne: function (d) { openEpargne(d.id); },
  saveEpargne: function (d) { saveEpargneForm(d.id); },
  delEpargne: function (d) {
    if (!confirm('Supprimer ce compte ?')) return;
    write('deleteEpargne', d.id).then(function () { removeLocal(D.epargne, d.id); closeSheet(); render(); });
  },
  loadJournal: function () { journalCache = null; render(); },
  backupNow: function () {
    call('backupNow').then(function (b) { D.lastBackup = b.horodatage; dirty = false; backupsCache = null; render(); toast('Sauvegarde effectuée'); });
  },
  restore: function (d) {
    if (!confirm('Restaurer la sauvegarde du ' + d.label + ' ?\nL\'état actuel sera d\'abord sauvegardé.')) return;
    call('restoreBackup', d.id).then(function (data) { setData(data); backupsCache = null; render(); toast('Sauvegarde restaurée'); });
  }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var a = ACT[el.dataset.act];
  if (!a) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  e.stopPropagation();
  a(el.dataset, el);
});
var quickTimer;
document.addEventListener('input', function (e) {
  var k = e.target.dataset && e.target.dataset.input;
  if (k === 'descAuto') {
    var id = form.descs && form.descs[e.target.value];
    var l = id && byId(D.libelles, id);
    if (l && l.actif) { if (l.sens !== form.sens) ACT.setSens({ sens: l.sens }); ACT.pickLib({ id: l.id }); }
  } else if (k === 'quick') {
    clearTimeout(quickTimer); quickTimer = setTimeout(applyQuick, 250);
  } else if (k === 'dateChange') {
    refreshBudgetMonth();
  } else if (k === 'moisTouched') {
    form.moisTouched = true;
  } else if (k === 'colorInput') {
    form.couleur = e.target.value;
  } else if (k === 'emojiInput') {
    form.emoji = e.target.value;
  } else if (k === 'libSens') {
    document.getElementById('l_type').innerHTML = typeOptions(e.target.value, e.target.value === 'entree' ? 'revenu' : 'envie');
  }
});

/* ================================================================== */
/* Sauvegarde à la fermeture + actualisation au retour                 */
/* ================================================================== */
function backupOnLeave() {
  if (!D || !canEdit() || !dirty) return;
  dirty = false;
  try { google.script.run.withFailureHandler(function () { dirty = true; }).autoBackup(); } catch (e) {}
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') backupOnLeave();
  else if (D && Date.now() - lastLoad > 30000 && !document.getElementById('overlay') && !pending) load();
});
window.addEventListener('pagehide', backupOnLeave);

var toastTimer;
function toast(msg, err) {
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, err ? 4000 : 1800);
}

load();
</script>
</body>
</html>
