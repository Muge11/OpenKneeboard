/* ================================================================== */
/* Actions (délégation d'événements)                                   */
/* ================================================================== */
var ACT = {
  tab: function (d) {
    if (tab !== d.tab && d.tab !== pref('startTab', 'synthese')) histPush('tab');
    navDir = tabIndex(d.tab) - tabIndex(tab);
    tab = d.tab; sub = ''; if (tab !== 'mouvements') mvtFilter = 'tous'; closeSheet(); render(); window.scrollTo(0, 0);
  },
  pickMonth: function () {
    if (tab === 'fixes' || tab === 'plus') return;
    var mp = document.getElementById('monthPicker');
    mp.value = mois;
    try { if (mp.showPicker) { mp.showPicker(); return; } } catch (e) {}
    mp.focus(); mp.click();
  },
  sub: function (d) { if (d.sub && !sub) histPush('sub'); sub = d.sub; if (sub === 'journal') journalCache = null; if (sub === 'backups') backupsCache = null; if (sub === 'rapport') rapportCache = null; render(); window.scrollTo(0, 0); },
  synSeg: function (d) { var o = ['resume', 'graph', 'conseils']; navDir = o.indexOf(d.v) - o.indexOf(synSeg); synSeg = d.v; vizSel = null; render(); },
  vizPeriod: function (d) { vizPeriod = +d.v; setPref('vizPeriod', vizPeriod); render(); },
  vizSel: function (d) { vizSel = d.v && vizSel !== d.v ? d.v : null; render(); },
  evoSel: function (d) { form.evoSel = d.v; render(); },
  advBasis: function (d) { advBasis = +d.v; setPref('advBasis', advBasis); render(); },
  openReperes: openReperes,
  saveReperes: function () {
    var rp = reperes();
    ['besoins', 'envies', 'epargne', 'endettement', 'logement'].forEach(function (k) { var v = parseAmount(val('rp_' + k)); if (v !== null) rp[k] = v; });
    rp.logementLibelles = val('rp_logL').split(',').map(function (s) { return s.trim(); }).filter(String);
    rp.libelles = {};
    val('rp_libs').split(/\n/).forEach(function (line) {
      var m = line.split('='); if (m.length < 2) return;
      var v = parseAmount(m[1]); if (m[0].trim() && v !== null) rp.libelles[m[0].trim()] = v;
    });
    busySave(write('saveReperes', rp)).then(function (json) { D.reperes = json; closeSheet(); render(); toast('Repères enregistrés'); });
  },
  resetReperes: function () {
    if (!confirm('Revenir aux repères par défaut ?')) return;
    write('saveReperes', {}).then(function (json) { D.reperes = json; closeSheet(); render(); });
  },
  prevMonth: function () { navDir = -1; mois = shiftMonth(mois, -1); render(); ensureMonthClient(); },
  nextMonth: function () { navDir = 1; mois = shiftMonth(mois, 1); render(); ensureMonthClient(); },
  refresh: function () { load().then(function () { toast('Données à jour'); }); },
  goFilter: function (d) { tab = 'mouvements'; mvtFilter = d.f; render(); },
  mvtFilter: function (d) { mvtFilter = d.f; render(); },
  close: closeSheet,
  newMvt: function () { openMvt(null); },
  openMvt: function (d) { openMvt(d.id); },
  saveMvt: function (d) { saveMvt(d.id); },
  delMvt: function (d) { delMvt(d.id); },
  dupMvt: function (d) { var x = byId(D.mouvements, d.id); openMvt(null, { libelleId: x.libelleId, montant: x.montant, description: x.description, vehiculeId: x.vehiculeId, compteId: compteOf(x) }); },
  nonRealise: function (d) {
    if (!confirm('Marquer ce fixe comme non réalisé pour ' + monthName(byId(D.mouvements, d.id).mois) + ' (0 €) ?')) return;
    saveMvt(d.id, true);
  },
  toggleNature: function () { var b = document.getElementById('natureBox'); b.hidden = !b.hidden; },
  toFixe: function (d) {
    var fin; try { fin = readFin('n_'); } catch (e) { return toast(e.message, true); }
    if (!confirm('Transformer ce mouvement en mouvement fixe ' + (fin ? 'jusqu\'à ' + monthName(fin) : 'perpétuel') + ' ?')) return;
    write('toFixe', d.id, fin).then(function (data) { setData(data); closeSheet(); render(); toast('Mouvement transformé en fixe'); });
  },
  toPonctuel: function (d) {
    if (!confirm('Rendre ce mouvement ponctuel ? Le fixe ne sera plus reporté les mois suivants.')) return;
    write('toPonctuel', d.id).then(function (data) { setData(data); closeSheet(); render(); toast('Mouvement rendu ponctuel'); });
  },
  setFin: function (d) {
    var x = byId(D.mouvements, d.id), r = x && byId(D.recurrents, x.recurrentId);
    var fin; try { fin = readFin('n_'); } catch (e) { return toast(e.message, true); }
    if (!r) return;
    var rec = JSON.parse(JSON.stringify(r)); rec.fin = fin; rec.actif = true;
    write('saveRecurrent', rec, x.mois).then(function (data) { setData(data); closeSheet(); render(); toast('Échéance enregistrée'); });
  },
  restoreOcc: function (d) { write('restoreOccurrence', d.id).then(function (m) { upsertLocal(D.mouvements, m); render(); toast('Rétabli'); }); },
  togglePointe: function (d) {
    var x = byId(D.mouvements, d.id); if (!x) return;
    x.pointe = !x.pointe; buzz(x.pointe ? 12 : 6); render();
    if (document.getElementById('overlay')) {
      if (form.kind === 'detail') { if (form.libId) openLibDetail(form.libId); else openGroupDetail(form.grp); }
      else if (form.kind === 'compte') openCompte(form.id);
      else if (form.kind === 'vehDetail') openVehDetail(form.id, form.period, form.year);
    }
    queuePointe(d.id, x.pointe);
  },
  setSens: function (d) {
    form.sens = d.sens; form.libelleId = '';
    Array.prototype.forEach.call(document.querySelectorAll('.sheet .seg button'), function (b) { b.classList.toggle('on', b.dataset.sens === d.sens); });
    document.getElementById('libWrap').innerHTML = libChips(form.sens, '');
  },
  pickLib: function (d) {
    form.libelleId = d.id;
    Array.prototype.forEach.call(document.querySelectorAll('#libChips .chip'), function (b) { b.classList.toggle('on', b.dataset.id === d.id); });
    if (form.kind === 'mvt') refreshBudgetMonth();
    if (form.kind === 'mvt' || form.kind === 'rec') { refreshVeh(); refreshCpt(); }
    if (form.kind === 'rec' && !form.id) { var c = document.getElementById('r_dec'); var l = byId(D.libelles, d.id); if (c && l) c.checked = !!l.moisSuivant; }
  },
  quickLib: function () {
    var nom = prompt('Nom du nouveau libellé (' + (form.sens === 'entree' ? 'entrée' : 'sortie') + ') :');
    if (!nom || !nom.trim()) return;
    var em = prompt('Emoji (facultatif) :', '') || '';
    write('saveLibelle', { nom: nom, sens: form.sens, groupe: form.sens === 'entree' ? 'Entrées' : 'Vie courante', emoji: em }).then(function (l) {
      D.libelles.push(l); form.libelleId = l.id;
      var w = document.getElementById('libWrap'); if (w) w.innerHTML = libChips(form.sens, l.id);
      toast('Libellé « ' + l.nom + ' » créé');
    });
  },
  pickEmoji: function (d) {
    form.emoji = d.v; document.getElementById('l_emoji').value = d.v;
    Array.prototype.forEach.call(document.querySelectorAll('#emojiGrid button'), function (b) { b.classList.toggle('on', b.dataset.v === d.v); });
  },
  toggleRep: function () { document.getElementById('repBox').hidden = !checked('m_rep'); },
  finMode: function (d, el) { var prefix = el.name.replace(/fin$/, ''); document.getElementById(prefix + 'finMois').hidden = el.value !== 'date'; },
  fixSort: function (d) {
    if (d.v === 'montant' && fixSort === 'montant') fixDir = fixDir === 'desc' ? 'asc' : 'desc';
    fixSort = d.v; setPref('fixSort', fixSort); setPref('fixDir', fixDir); render();
  },
  newRec: function (d) { openRec(null, d.sens); },
  openRec: function (d) { openRec(d.id); },
  saveRec: function (d) { saveRec(d.id); },
  stopRec: function (d) { stopRec(d.id); },
  dupRec: function (d) { var r = byId(D.recurrents, d.id); openRec(null, lib(r.libelleId).sens, { libelleId: r.libelleId, montant: r.montant, description: r.description, jour: r.jour, decalage: r.decalage, vehiculeId: r.vehiculeId, compteId: compteOfRec(r.id) }); },
  doImport: function () {
    var t = val('importTxt'); if (!t.trim()) return;
    write('importRecurrents', t).then(function (res) {
      setData(res.data); render();
      toast(res.count + ' importé(s)' + (res.skipped.length ? ', ' + res.skipped.length + ' ligne(s) ignorée(s)' : ''), !!res.skipped.length);
    });
  },
  openEnv: function (d) { openEnv(d.id); },
  libDetail: function (d) { openLibDetail(d.id); },
  grpDetail: function (d) { openGroupDetail(d.k); },
  goLib: function (d) { closeSheet(); tab = 'mouvements'; sub = ''; mvtFilter = 'lib:' + d.id; mvtQuery = ''; render(); window.scrollTo(0, 0); },
  goGrp: function (d) { closeSheet(); tab = 'mouvements'; sub = ''; mvtFilter = 'grp:' + d.k; mvtQuery = ''; render(); window.scrollTo(0, 0); },
  goVeh: function () { tab = 'plus'; sub = 'vehicules'; render(); window.scrollTo(0, 0); },
  goVehLib: function (d) { tab = 'mouvements'; sub = ''; mvtFilter = 'veh:' + d.v; mvtQuery = lib(d.id).nom; mvtScope = 'tous'; render(); window.scrollTo(0, 0); },
  pickVeh: function (d) { form.vehiculeId = d.id; refreshVeh(); },
  openVeh: function (d) { openVeh(d.id); },
  vehEmoji: function (d) { document.getElementById('v_emoji').value = d.v; },
  saveVeh: function (d) {
    var v = { id: d.id || '', nom: val('v_nom'), emoji: val('v_emoji'), actif: d.id ? checked('v_actif') : true };
    if (!v.nom.trim()) return toast('Nom manquant', true);
    busySave(write('saveVehicule', v)).then(function (saved) { D.vehicules = D.vehicules || []; upsertLocal(D.vehicules, saved); closeSheet(); render(); toast('Véhicule enregistré'); });
  },
  mvtScope: function (d) { mvtScope = d.v; setPref('mvtScope', mvtScope); updateMvtResults(); Array.prototype.forEach.call(document.querySelectorAll('#scopeChips .chip'), function (b) { b.classList.toggle('on', b.dataset.v === mvtScope); }); },
  clearSearch: function (d) { if (d.v === 'mvt') mvtQuery = ''; else fixQuery = ''; render(); },
  saveEnv: function (d) { saveEnv(d.id); },
  delEnv: function (d) { if (confirm('Supprimer ce montant (selon le choix « Appliquer ») ?')) saveEnv(d.id, 0); },
  fillEnv: function (d) { document.getElementById('v_amt').value = amtInput(d.v); },
  openLib: function (d) { openLib(d.id); },
  saveLib: function (d) { saveLib(d.id); },
  delLib: function (d) { delLib(d.id); },
  openUser: function (d) { openUser(d.email); },
  saveUserForm: function (d) { saveUserForm(d.id); },
  pickColor: function (d) {
    form.couleur = d.c; document.getElementById('u_color').value = d.c;
    Array.prototype.forEach.call(document.querySelectorAll('#swatches button'), function (b) { b.classList.toggle('on', b.dataset.c === d.c); });
  },
  openAttente: function (d) { openAttente(d.id); },
  saveAttente: function (d) { saveAttenteForm(d.id); },
  delAttente: function (d) { write('deleteAttente', d.id).then(function () { removeLocal(D.attente, d.id); closeSheet(); render(); }); },
  fold: function (d, el) {
    var f = el.closest('.fold'); if (!f) return;
    var closed = f.classList.toggle('closed');
    setOpen(d.k, !closed);
  },
  foldRow: function (d, el) {
    var closed = el.classList.toggle('closed');
    Array.prototype.forEach.call(document.querySelectorAll('tr.sub[data-p="' + d.k.replace(/"/g, '\\"') + '"]'), function (r) { r.classList.toggle('hid', closed); });
    setOpen(d.k, !closed);
  },
  dayFold: function (d, el) { el.classList.toggle('closed'); },
  toggleMore: function (d, el) { var b = document.getElementById('moreBox'); b.hidden = !b.hidden; el.querySelector('.chev').style.transform = b.hidden ? 'rotate(-90deg)' : ''; },
  pickCpt: function (d) { form.compteId = d.id; form.cptChanged = true; refreshCpt(); },
  openCompte: function (d) { openCompte(d.id); },
  openCompteEdit: function (d) { openCompteEdit(d.id); },
  cptEmoji: function (d) { document.getElementById('c_emoji').value = d.v; },
  saveCompte: function (d) {
    var c = { id: d.id || '', nom: val('c_nom'), emoji: val('c_emoji'), soldeRef: parseAmount(val('c_solde')) || 0, dateRef: val('c_date'),
      visibles: Array.prototype.map.call(document.querySelectorAll('.c_vis:checked'), function (e) { return e.value; }) };
    if (!c.nom.trim()) return toast('Nom manquant', true);
    busySave(write('saveCompte', c)).then(function (cps) { D.comptes = cps; closeSheet(); render(); toast('Compte enregistré — partage mis à jour'); });
  },
  delCompte: function (d) {
    if (!confirm('Archiver ce compte ? Il disparaîtra de l\'appli et ne sera plus partagé (le fichier est conservé dans votre Drive).')) return;
    write('deleteCompte', d.id).then(function (cps) { D.comptes = cps; closeSheet(); render(); toast('Compte archivé'); });
  },
  vehDetail: function (d) { form = {}; openVehDetail(d.id); },
  vehPeriod: function (d) { openVehDetail(form.id, d.v, form.year); },
  vehYear: function (d) { openVehDetail(form.id, 'annee', String(d.v)); },
  copyLink: function (d) {
    try { navigator.clipboard.writeText(d.v).then(function () { toast('Lien copié'); }); } catch (e) { toast('Sélectionnez le lien et copiez-le', true); }
  },
  relSeen: function () {
    closeSheet();
    if (canEdit()) { D.me.versionVue = D.version; bg('markSeen', []); } else lsSet('budget.versionVue', D.version);
  },
  setTheme: function (d) { setPref('theme', d.v); render(); },
  resetFolds: function () { setPref('open', {}); render(); toast('Sections réinitialisées'); },
  prefRapport: function (d, el) { setPref('rapport', el.checked); toast(el.checked ? 'Vous recevrez le compte rendu' : 'Compte rendu désactivé'); },
  rapportUser: function (d, el) {
    var u = user(d.email); if (!u) return;
    write('saveUser', { email: u.email, nom: u.nom, role: u.role, couleur: u.couleur, actif: u.actif, rapport: el.checked }).then(function (res) {
      upsertLocal(D.users, res.user, 'email'); if (res.user.email === D.me.email) { D.me = res.user; loadPrefs(); }
      toast(el.checked ? u.nom + ' recevra le compte rendu' : u.nom + ' ne le recevra plus');
    });
  },
  rapportPreview: function () {
    var m = val('rp_mois'); if (!m) return;
    call('previewReport', m).then(function (html) {
      var box = document.getElementById('rpPreview');
      box.innerHTML = '<iframe class="preview" style="margin-top:12px"></iframe>';
      box.querySelector('iframe').srcdoc = html;
    });
  },
  rapportSend: function () {
    var m = val('rp_mois'); if (!m) return;
    if (!confirm('Envoyer maintenant le compte rendu de ' + monthName(m) + ' aux destinataires ?')) return;
    call('sendReportNow', m).then(function (sent) { rapportCache = null; render(); toast(sent.length ? 'Envoyé à ' + sent.join(', ') : 'Aucun destinataire', !sent.length); });
  },
  loadJournal: function () { journalCache = null; render(); },
  backupNow: function () {
    call('backupNow').then(function (b) { D.lastBackup = b.horodatage; dirty = false; backupsCache = null; render(); toast('Sauvegarde effectuée'); });
  },
  restore: function (d) {
    if (!confirm('Restaurer la sauvegarde du ' + d.label + ' ?\nL\'état actuel sera d\'abord sauvegardé.')) return;
    call('restoreBackup', d.id).then(function (data) { setData(data); backupsCache = null; render(); toast('Sauvegarde restaurée'); });
  }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var a = ACT[el.dataset.act];
  if (!a) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  e.stopPropagation();
  a(el.dataset, el);
});
var quickTimer;
document.addEventListener('input', function (e) {
  var k = e.target.dataset && e.target.dataset.input;
  if (k === 'descAuto') {
    var id = form.descs && form.descs[e.target.value];
    var l = id && byId(D.libelles, id);
    if (l && l.actif) { if (l.sens !== form.sens) ACT.setSens({ sens: l.sens }); ACT.pickLib({ id: l.id }); }
  } else if (k === 'monthPicker') {
    if (/^\d{4}-\d{2}$/.test(e.target.value)) { mois = e.target.value; render(); ensureMonthClient(); }
  } else if (k === 'mvtFilterSel') {
    mvtFilter = e.target.value; render();
  } else if (k === 'prefSel') {
    var v = e.target.dataset.num ? +e.target.value : e.target.value;
    setPref(e.target.dataset.k, v);
    if (e.target.dataset.k === 'vizPeriod') vizPeriod = v;
    if (e.target.dataset.k === 'advBasis') advBasis = v;
    if (e.target.dataset.k === 'mvtScope') mvtScope = v;
  } else if (k === 'searchMvt') {
    mvtQuery = e.target.value;
    document.getElementById('scopeChips').hidden = !mvtQuery;
    clearTimeout(quickTimer); quickTimer = setTimeout(updateMvtResults, 150);
  } else if (k === 'searchFix') {
    fixQuery = e.target.value;
    clearTimeout(quickTimer); quickTimer = setTimeout(function () { var r = document.getElementById('fixResults'); if (r) r.innerHTML = fixListsHtml(); }, 150);
  } else if (k === 'quick') {
    clearTimeout(quickTimer); quickTimer = setTimeout(applyQuick, 250);
  } else if (k === 'dateChange') {
    refreshBudgetMonth();
  } else if (k === 'moisTouched') {
    form.moisTouched = true;
  } else if (k === 'colorInput') {
    form.couleur = e.target.value;
  } else if (k === 'emojiInput') {
    form.emoji = e.target.value;
  } else if (k === 'libSens') {
    document.getElementById('l_type').innerHTML = typeOptions(e.target.value, e.target.value === 'entree' ? 'revenu' : 'envie');
    document.getElementById('l_pvBox').hidden = e.target.value === 'entree';
  }
});

/* ================================================================== */
/* Sauvegarde à la fermeture + actualisation au retour                 */
/* ================================================================== */
function backupOnLeave() {
  flushPointes();
  if (!D || !canEdit() || !dirty) return;
  dirty = false;
  try { google.script.run.withFailureHandler(function () { dirty = true; }).autoBackup(); } catch (e) {}
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') backupOnLeave();
  else if (D && Date.now() - lastLoad > 30000 && !document.getElementById('overlay') && !pending) load();
});
window.addEventListener('pagehide', backupOnLeave);

var toastTimer;
function toast(msg, err) {
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, err ? 4000 : 1800);
}

function setOffline(off) {
  OFFLINE = off;
  document.getElementById('offbar').hidden = !off;
  if (D) { document.getElementById('fab').hidden = !canEdit(); render(); }
  if (!off && D) load();
}
window.addEventListener('offline', function () { setOffline(true); });
window.addEventListener('online', function () { setOffline(false); toast('Connexion rétablie'); });
document.getElementById('offbar').hidden = !OFFLINE;

applyTheme();
bootFromCache();
load();
</script>
</body>
</html>
