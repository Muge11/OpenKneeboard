<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>Budget</title>
<style>
  :root {
    --bg: #f3f5f4; --card: #ffffff; --text: #18211e; --muted: #66726d; --line: #e2e7e5;
    --accent: #1f6f5c; --accent-soft: #dcefe9; --good: #1d7a46; --bad: #c0392b; --warn: #c77c0e;
    --chip: #eef1f0; --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1413; --card: #18201e; --text: #e7ecea; --muted: #93a19b; --line: #2a3431;
      --accent: #48b394; --accent-soft: #1d3a32; --good: #4cc27f; --bad: #ff6b5b; --warn: #f0a63a;
      --chip: #24302c; --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .muted { color: var(--muted); }
  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .small { font-size: 13px; }
  code { font-size: 12px; background: var(--chip); padding: 1px 4px; border-radius: 4px; }

  header { position: sticky; top: 0; z-index: 10; background: var(--accent); color: #fff;
    padding: calc(6px + env(safe-area-inset-top)) 8px 6px; display: flex; align-items: center; gap: 4px; }
  header .month { flex: 1; text-align: center; }
  header .month b { display: block; font-size: 17px; text-transform: capitalize; }
  header .month span { font-size: 11px; opacity: .8; }
  header button { background: transparent; border: 0; color: #fff; font-size: 22px; width: 44px; height: 40px; border-radius: 10px; cursor: pointer; }
  header button:active { background: rgba(255,255,255,.15); }

  main { max-width: 760px; margin: 0 auto; padding: 12px 12px 24px; }
  .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .backbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .backbar h1 { font-size: 18px; margin: 0; flex: 1; }

  .hero { text-align: center; padding: 18px 14px; }
  .hero .label { color: var(--muted); font-size: 13px; }
  .hero .big { font-size: 34px; font-weight: 700; margin: 2px 0; }
  .hero .sub { display: flex; justify-content: center; gap: 6px 18px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 3px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.pc { font-size: 11px; color: var(--muted); }
  tr.grp td { font-weight: 700; background: var(--chip); }
  tr.sub td:first-child { padding-left: 14px; color: var(--muted); }
  tr.total td { font-weight: 700; border-bottom: 0; }

  .bar { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; margin-top: 5px; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .bar > span.over { background: var(--bad); }
  .prog { margin-bottom: 12px; }
  .prog .top { display: flex; justify-content: space-between; gap: 8px; }

  .list { margin: 0; padding: 0; list-style: none; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item .main { flex: 1; min-width: 0; }
  .item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; }
  .item .amt { text-align: right; }
  .item.off { opacity: .5; }
  .day { font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 2px 2px; text-transform: capitalize; }
  .who { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 0 7px; border-radius: 9px; color: #fff; line-height: 18px; }
  .who.auto { background: var(--chip); color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .tag { font-size: 11px; background: var(--accent-soft); color: var(--accent); padding: 0 6px; border-radius: 6px; line-height: 18px; }
  .tag.warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); }

  .sec-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; gap: 8px; }
  .sec-head h2 { margin: 0; }
  .check { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: transparent;
    display: grid; place-items: center; flex: none; cursor: pointer; font-size: 15px; color: #fff; padding: 0; }
  .check.on { background: var(--good); border-color: var(--good); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: var(--chip); padding: 7px 12px; border-radius: 18px; cursor: pointer; font-size: 14px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.add { border-style: dashed; background: transparent; color: var(--accent); }
  .filters { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; margin-bottom: 8px; }
  .filters .chip { white-space: nowrap; }
  .seg { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 9px; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
  .seg button.on.s { color: var(--bad); } .seg button.on.e { color: var(--good); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px;
    padding: 11px 16px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn.ghost { background: var(--chip); color: var(--text); }
  .btn.danger { background: transparent; color: var(--bad); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 6px 0; font-weight: 600; }
  .menu .item .title { font-weight: 500; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; border: 0; background: transparent; padding: 8px 0 7px; font-size: 11px; color: var(--muted); cursor: pointer; }
  nav button .ic { display: block; font-size: 20px; line-height: 1.2; }
  nav button.on { color: var(--accent); font-weight: 600; }
  .fab { position: fixed; right: 16px; bottom: calc(74px + env(safe-area-inset-bottom)); z-index: 21; width: 58px; height: 58px;
    border-radius: 50%; border: 0; background: var(--accent); color: #fff; font-size: 30px; box-shadow: 0 4px 14px rgba(0,0,0,.25); cursor: pointer; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); animation: up .18s ease-out; }
  @media (min-width: 600px) { .overlay { align-items: center; } .sheet { border-radius: 18px; } }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h3 { margin: 0 0 12px; font-size: 18px; }
  .field { margin-bottom: 12px; }
  .field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  input, select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--accent); transform: scale(1.2); margin: 0 6px 0 2px; }
  input[type=color] { padding: 2px; height: 42px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  input.amount { font-size: 28px; font-weight: 700; text-align: center; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt { display: flex; align-items: center; padding: 6px 0; cursor: pointer; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  .info { background: var(--accent-soft); border-radius: 10px; padding: 9px 12px; font-size: 13px; margin-bottom: 12px; }
  .actions { display: flex; gap: 10px; margin-top: 6px; }
  .actions .btn:last-child { flex: 1; }
  .foot { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: center; }

  .empty { text-align: center; padding: 26px 10px; color: var(--muted); }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(146px + env(safe-area-inset-bottom)); z-index: 60;
    background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw; }
  .toast.err { background: var(--bad); }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 100; color: var(--muted); padding: 20px; text-align: center; }
  .spin { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .busy { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 56px; z-index: 30; }
  .busy .spin { width: 16px; height: 16px; border-width: 2px; border-color: rgba(255,255,255,.4); border-top-color: #fff; margin: 0; }

  .evo { display: flex; align-items: flex-end; gap: 8px; height: 120px; padding-top: 6px; }
  .evo .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
  .evo .bars { display: flex; gap: 2px; align-items: flex-end; height: 90px; }
  .evo .bars span { width: 9px; border-radius: 3px 3px 0 0; }
  .evo .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: capitalize; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .swatches button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .swatches button.on { border-color: var(--text); }
  .jr { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .jr .h { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="loading" id="loading"><div><div class="spin"></div>Chargement…</div></div>

<header>
  <button data-act="prevMonth" aria-label="Mois précédent">‹</button>
  <div class="month"><b id="monthLabel"></b><span id="versionLabel"></span></div>
  <button data-act="nextMonth" aria-label="Mois suivant">›</button>
  <button data-act="refresh" aria-label="Actualiser" style="font-size:19px">⟳</button>
</header>
<div class="busy" id="busy" hidden><div class="spin"></div></div>

<main id="view"></main>

<button class="fab" id="fab" data-act="newMvt" aria-label="Ajouter un mouvement">+</button>
<nav id="nav">
  <button data-act="tab" data-tab="synthese"><span class="ic">📊</span>Synthèse</button>
  <button data-act="tab" data-tab="mouvements"><span class="ic">🧾</span>Mouvements</button>
  <button data-act="tab" data-tab="fixes"><span class="ic">🔁</span>Fixes</button>
  <button data-act="tab" data-tab="plus"><span class="ic">⋯</span>Plus</button>
</nav>

<script>
/* ================================================================== */
/* État & utilitaires                                                  */
/* ================================================================== */
var D = null;
var tab = 'synthese';
var sub = '';               // sous-page de « Plus »
var mois = ymNow();
var mvtFilter = 'tous';
var lastLoad = 0;
var pending = 0;
var dirty = false;          // modifications depuis la dernière sauvegarde
var ensured = {};
var journalCache = null;
var backupsCache = null;
var form = {};              // état du formulaire ouvert

var ROLE_LABEL = { admin: 'Administrateur', editeur: 'Éditeur', lecteur: 'Lecteur' };
var COLORS = ['#1f6f5c', '#c2185b', '#1565c0', '#ef6c00', '#6a1b9a', '#2e7d32', '#00838f', '#5d4037'];
var ICONS = {
  'Salaires': '💼', 'Entrées exceptionnelles': '🎁', 'Remboursements médicaux': '🩺', 'Remboursements divers': '↩️',
  'Carburant': '⛽', 'Prêt auto': '🚗', 'Prêt maison': '🏠', 'Crédit conso': '💳', 'Alimentaire': '🛒', 'Divers': '📦',
  'Resto': '🍽️', 'Loisirs': '🎉', 'Voyage / Vacances': '✈️', 'Electricité': '⚡', 'Eau': '💧', 'Impôts': '🏛️',
  'Abonnements': '📱', 'Epargne': '🐷', 'Scolarité': '🎒', 'Assurances': '🛡️'
};

var fmt = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
function eur(n) { return fmt.format(Number(n) || 0); }
function pct(n) { return isFinite(n) ? (Math.round(n * 1000) / 10).toLocaleString('fr-FR') + ' %' : '—'; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function parseAmount(s) {
  var n = parseFloat(String(s || '').replace(/[\s  €]/g, '').replace(',', '.'));
  return isNaN(n) ? null : Math.round(n * 100) / 100;
}
function amtInput(n) { return n === '' || n == null ? '' : String(n).replace('.', ','); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymNow() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function todayStr() { var d = new Date(); return ymNow() + '-' + pad(d.getDate()); }
function shiftMonth(m, k) {
  var d = new Date(+m.substring(0, 4), +m.substring(5, 7) - 1 + k, 1);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1);
}
function monthName(m, short) {
  if (!m) return '';
  var d = new Date(+m.substring(0, 4), +m.substring(5, 7) - 1, 1);
  return d.toLocaleDateString('fr-FR', short ? { month: 'short' } : { month: 'long', year: 'numeric' });
}
function dayName(s) {
  var d = new Date(+s.substring(0, 4), +s.substring(5, 7) - 1, +s.substring(8, 10));
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}
function dt(iso) { return iso ? iso.replace('T', ' ').substring(0, 16) : ''; }
function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
function lib(id) { return byId(D.libelles, id) || { id: id, nom: '?', sens: 'sortie', groupe: '?', budget: 0 }; }
function icon(l) { return ICONS[l.nom] || (l.sens === 'entree' ? '💶' : '•'); }
function role() { return D.me.role; }
function canEdit() { return role() === 'admin' || role() === 'editeur'; }
function isAdmin() { return role() === 'admin'; }
function user(email) {
  for (var i = 0; i < D.users.length; i++) if (D.users[i].email.toLowerCase() === String(email).toLowerCase()) return D.users[i];
  return null;
}
function whoBadge(email, prefix) {
  if (!email || email === 'auto') return '<span class="who auto">🔁 report auto</span>';
  if (email === 'système') return '<span class="who auto">système</span>';
  var u = user(email);
  return '<span class="who" style="background:' + esc(u ? u.couleur : '#888') + '">' + (prefix || '') + esc(u ? u.nom : email) + '</span>';
}
function libsSorted(sens) {
  return D.libelles.filter(function (l) { return l.actif && (!sens || l.sens === sens); })
    .sort(function (a, b) { return a.ordre - b.ordre; });
}
function groupsOf(sens) {
  var g = [];
  libsSorted(sens).forEach(function (l) { if (g.indexOf(l.groupe) < 0) g.push(l.groupe); });
  return g;
}
function upsertLocal(arr, rec, key) {
  key = key || 'id';
  for (var i = 0; i < arr.length; i++) if (arr[i][key] === rec[key]) { arr[i] = rec; return; }
  arr.push(rec);
}
function removeLocal(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) { arr.splice(i, 1); return; } }

/* ================================================================== */
/* Serveur                                                             */
/* ================================================================== */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  pending++; document.getElementById('busy').hidden = false;
  return new Promise(function (resolve, reject) {
    var r = google.script.run
      .withSuccessHandler(function (x) { done(); resolve(x); })
      .withFailureHandler(function (e) { done(); toast((e && e.message) || String(e), true); reject(e); });
    r[fn].apply(r, args);
  });
  function done() { pending--; if (!pending) document.getElementById('busy').hidden = true; }
}
function write(fn) {
  return call.apply(null, arguments).then(function (x) { dirty = true; return x; });
}

function load() {
  return call('getAll').then(function (data) {
    setData(data);
    document.getElementById('loading').style.display = 'none';
    render();
    ensureMonthClient();
  }, function (e) {
    document.getElementById('loading').innerHTML = '<div>⛔<br><br>' + esc((e && e.message) || 'Impossible de charger les données.') +
      '<br><br><button class="btn" onclick="location.reload()">Réessayer</button></div>';
    document.getElementById('loading').style.display = 'grid';
  });
}
function setData(data) {
  D = data; lastLoad = Date.now(); ensured = {};
  document.getElementById('versionLabel').textContent = 'v' + D.version + (D.stage ? ' · ' + D.stage : '');
  document.getElementById('fab').hidden = !canEdit();
}

/** Crée les occurrences manquantes des mouvements fixes pour le mois affiché. */
function ensureMonthClient() {
  if (!canEdit() || ensured[mois]) return;
  var m = mois;
  var missing = D.recurrents.some(function (r) {
    return r.actif && r.debut <= m && (!r.fin || r.fin >= m) &&
      !D.mouvements.some(function (x) { return x.recurrentId === r.id && x.mois === m; });
  });
  ensured[m] = true;
  if (!missing) return;
  write('ensureMonth', m).then(function (rows) {
    rows.forEach(function (r) { D.mouvements.push(r); });
    if (rows.length) { render(); toast(rows.length + ' mouvement(s) fixe(s) reporté(s)'); }
  });
}

/* ================================================================== */
/* Calculs                                                             */
/* ================================================================== */
function compute(m) {
  var mv = D.mouvements.filter(function (x) { return x.mois === m && x.statut !== 'annule'; });
  var per = {};
  D.libelles.forEach(function (l) {
    per[l.id] = { lib: l, prevu: l.actif && Number(l.budget) > 0 ? Number(l.budget) : 0, reel: 0, n: 0 };
  });
  mv.forEach(function (x) {
    var p = per[x.libelleId] || (per[x.libelleId] = { lib: lib(x.libelleId), prevu: 0, reel: 0, n: 0 });
    p.reel += Number(x.montant) || 0;
    p.n++;
    if (x.recurrentId) p.prevu += Number(x.prevu) || 0;
  });
  var tot = { entree: { prevu: 0, reel: 0 }, sortie: { prevu: 0, reel: 0 } };
  var groups = {};
  Object.keys(per).forEach(function (k) {
    var p = per[k];
    if (!p.prevu && !p.reel && !p.lib.actif) return;
    var s = p.lib.sens;
    tot[s].prevu += p.prevu; tot[s].reel += p.reel;
    var gk = s + '|' + p.lib.groupe;
    if (!groups[gk]) groups[gk] = { sens: s, nom: p.lib.groupe, prevu: 0, reel: 0, libs: [] };
    groups[gk].prevu += p.prevu; groups[gk].reel += p.reel; groups[gk].libs.push(p);
  });
  return {
    mv: mv, per: per, tot: tot, groups: groups,
    bilan: { prevu: tot.entree.prevu - tot.sortie.prevu, reel: tot.entree.reel - tot.sortie.reel },
    todo: mv.filter(function (x) { return !x.pointe; }).length
  };
}

/* ================================================================== */
/* Rendu                                                               */
/* ================================================================== */
function render() {
  if (!D) return;
  document.getElementById('monthLabel').textContent = monthName(mois);
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
    b.classList.toggle('on', b.dataset.tab === tab);
  });
  var c = compute(mois);
  var v = tab === 'plus' && sub ? SUBVIEWS[sub] : { synthese: viewSynthese, mouvements: viewMouvements, fixes: viewFixes, plus: viewPlus }[tab];
  document.getElementById('view').innerHTML = v(c);
}

function viewSynthese(c) {
  var b = c.bilan, h = '';
  h += '<div class="card hero"><div class="label">Reste à vivre (réel)</div>' +
    '<div class="big num ' + (b.reel < 0 ? 'bad' : 'good') + '">' + eur(b.reel) + '</div>' +
    '<div class="sub"><span>Prévu : <b class="num">' + eur(b.prevu) + '</b></span>' +
    '<span>Entrées : <b class="num">' + eur(c.tot.entree.reel) + '</b></span>' +
    '<span>Sorties : <b class="num">' + eur(c.tot.sortie.reel) + '</b></span></div></div>';

  if (c.todo) {
    h += '<div class="card item" style="border:0" data-act="goFilter" data-f="apointer"><span style="font-size:22px">☑️</span>' +
      '<div class="main"><b>' + c.todo + ' mouvement' + (c.todo > 1 ? 's' : '') + '</b> à pointer sur le relevé</div><span class="muted">›</span></div>';
  }

  var env = Object.keys(c.per).map(function (k) { return c.per[k]; })
    .filter(function (p) { return p.lib.sens === 'sortie' && Number(p.lib.budget) > 0 && p.lib.actif; });
  if (env.length) {
    h += '<div class="card"><h2>Enveloppes du mois</h2>';
    env.forEach(function (p) {
      var ratio = p.prevu > 0 ? p.reel / p.prevu : 0, reste = p.prevu - p.reel;
      h += '<div class="prog"><div class="top"><span>' + icon(p.lib) + ' ' + esc(p.lib.nom) + '</span>' +
        '<span class="num"><b>' + eur(p.reel) + '</b> <span class="muted">/ ' + eur(p.prevu) + '</span></span></div>' +
        '<div class="bar"><span class="' + (ratio > 1 ? 'over' : '') + '" style="width:' + Math.min(100, ratio * 100) + '%"></span></div>' +
        '<div class="small ' + (reste < 0 ? 'bad' : 'muted') + '">' + (reste < 0 ? 'Dépassement de ' + eur(-reste) : 'Reste ' + eur(reste)) + '</div></div>';
    });
    h += '</div>';
  }

  var revP = c.tot.entree.prevu, revR = c.tot.entree.reel;
  h += '<div class="card"><h2>Synthèse &amp; répartition</h2><table><thead><tr><th></th><th>Prévu</th><th>%</th><th>Réel</th><th>%</th></tr></thead><tbody>';
  ['entree', 'sortie'].forEach(function (s) {
    Object.keys(c.groups).map(function (k) { return c.groups[k]; }).filter(function (g) { return g.sens === s; }).forEach(function (g) {
      h += '<tr class="grp"><td>' + esc(g.nom) + '</td><td class="num">' + eur(g.prevu) + '</td><td class="pc">' + pct(g.prevu / revP) +
        '</td><td class="num ' + (s === 'sortie' && g.reel > g.prevu + 0.005 ? 'bad' : '') + '">' + eur(g.reel) + '</td><td class="pc">' + pct(g.reel / revR) + '</td></tr>';
      g.libs.sort(function (a, b) { return a.lib.ordre - b.lib.ordre; }).forEach(function (p) {
        if (!p.prevu && !p.reel) return;
        h += '<tr class="sub"><td>' + icon(p.lib) + ' ' + esc(p.lib.nom) + '</td><td class="num">' + eur(p.prevu) + '</td><td></td>' +
          '<td class="num ' + (s === 'sortie' && p.reel > p.prevu + 0.005 ? 'bad' : '') + '">' + eur(p.reel) + '</td><td></td></tr>';
      });
    });
    if (s === 'entree') {
      h += '<tr class="total"><td>Total entrées</td><td class="num">' + eur(revP) + '</td><td class="pc">100 %</td><td class="num">' + eur(revR) + '</td><td class="pc">100 %</td></tr>';
    } else {
      h += '<tr class="total"><td>Total sorties</td><td class="num">' + eur(c.tot.sortie.prevu) + '</td><td class="pc">' + pct(c.tot.sortie.prevu / revP) +
        '</td><td class="num">' + eur(c.tot.sortie.reel) + '</td><td class="pc">' + pct(c.tot.sortie.reel / revR) + '</td></tr>';
    }
  });
  h += '<tr class="total"><td>Reste à vivre</td><td class="num ' + (b.prevu < 0 ? 'bad' : 'good') + '">' + eur(b.prevu) + '</td><td class="pc">' + pct(b.prevu / revP) +
    '</td><td class="num ' + (b.reel < 0 ? 'bad' : 'good') + '">' + eur(b.reel) + '</td><td class="pc">' + pct(b.reel / revR) + '</td></tr>';
  h += '</tbody></table></div>';

  h += viewEvolution();
  return h;
}

function viewEvolution() {
  var months = {};
  D.mouvements.forEach(function (x) { months[x.mois] = true; });
  var list = Object.keys(months).sort().filter(function (m) { return m <= mois; }).slice(-6);
  if (list.length < 2) return '';
  var data = list.map(function (m) { var c = compute(m); return { m: m, e: c.tot.entree.reel, s: c.tot.sortie.reel, b: c.bilan.reel }; });
  var max = Math.max.apply(null, data.map(function (d) { return Math.max(d.e, d.s, 1); }));
  var h = '<div class="card"><h2>Évolution (réel)</h2><div class="evo">';
  data.forEach(function (d) {
    h += '<div class="col" data-act="gotoMonth" data-m="' + d.m + '">' +
      '<div class="num ' + (d.b < 0 ? 'bad' : 'good') + '" style="font-size:10px">' + Math.round(d.b) + '</div>' +
      '<div class="bars"><span style="height:' + (d.e / max * 90) + 'px;background:var(--accent)"></span>' +
      '<span style="height:' + (d.s / max * 90) + 'px;background:var(--warn)"></span></div>' +
      '<div class="lbl">' + esc(monthName(d.m, true)) + '</div></div>';
  });
  return h + '</div><div class="legend"><span><i style="background:var(--accent)"></i>Entrées</span><span><i style="background:var(--warn)"></i>Sorties</span><span>Chiffre = reste à vivre</span></div></div>';
}

function mvtItem(x) {
  var l = lib(x.libelleId), entree = l.sens === 'entree';
  var chk = canEdit()
    ? '<button class="check ' + (x.pointe ? 'on' : '') + '" data-act="togglePointe" data-id="' + x.id + '" aria-label="Pointer">' + (x.pointe ? '✓' : '') + '</button>'
    : '<span class="check ' + (x.pointe ? 'on' : '') + '">' + (x.pointe ? '✓' : '') + '</span>';
  var meta = esc(l.nom) + ' ' + whoBadge(x.saisiPar, x.saisiPar === 'auto' ? '' : 'Saisi par ');
  if (x.date.substring(0, 7) !== x.mois) meta += ' <span class="tag">↪ budget ' + esc(monthName(x.mois)) + '</span>';
  if (x.recurrentId && x.modifie) meta += ' <span class="tag warn">modifié ce mois</span>';
  if (x.modifPar && x.modifPar !== x.saisiPar) meta += ' ' + whoBadge(x.modifPar, 'Modifié par ');
  return '<li class="item" data-act="openMvt" data-id="' + x.id + '">' + chk +
    '<div class="main"><div class="title">' + icon(l) + ' ' + esc(x.description || l.nom) + (x.recurrentId ? ' <span class="tag">fixe</span>' : '') + '</div>' +
    '<div class="meta">' + meta + '</div></div>' +
    '<div class="amt num ' + (entree ? 'good' : '') + '"><b>' + (entree ? '+' : '−') + eur(Math.abs(x.montant)).replace('-', '') + '</b></div></li>';
}

function viewMouvements(c) {
  var F = { tous: 'Tous', sortie: 'Sorties', entree: 'Entrées', fixes: 'Fixes', ponctuels: 'Ponctuels', apointer: 'À pointer' };
  var h = '<div class="chips filters">';
  Object.keys(F).forEach(function (k) {
    h += '<button class="chip ' + (mvtFilter === k ? 'on' : '') + '" data-act="mvtFilter" data-f="' + k + '">' + F[k] +
      (k === 'apointer' ? ' (' + c.todo + ')' : '') + '</button>';
  });
  h += '</div>';
  var list = c.mv.filter(function (x) {
    var s = lib(x.libelleId).sens;
    return mvtFilter === 'tous' || mvtFilter === s || (mvtFilter === 'fixes' && x.recurrentId) ||
      (mvtFilter === 'ponctuels' && !x.recurrentId) || (mvtFilter === 'apointer' && !x.pointe);
  }).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.saisiLe < b.saisiLe ? 1 : -1); });
  var tE = 0, tS = 0;
  list.forEach(function (x) { if (lib(x.libelleId).sens === 'entree') tE += +x.montant; else tS += +x.montant; });
  h += '<div class="card"><div class="sec-head"><h2>' + list.length + ' mouvement' + (list.length > 1 ? 's' : '') + '</h2>' +
    '<span class="small num"><span class="good">+' + eur(tE) + '</span> · −' + eur(tS) + '</span></div>';
  if (!list.length) {
    h += '<div class="empty">Aucun mouvement.' + (canEdit() ? '<br>Appuyez sur <b>+</b> pour en ajouter un.' : '') + '</div>';
  } else {
    var day = '';
    list.forEach(function (x) {
      if (x.date !== day) { h += (day ? '</ul>' : '') + '<div class="day">' + esc(dayName(x.date)) + '</div><ul class="list">'; day = x.date; }
      h += mvtItem(x);
    });
    h += '</ul>';
  }
  var annules = D.mouvements.filter(function (x) { return x.mois === mois && x.statut === 'annule'; });
  if (annules.length && canEdit()) {
    h += '<div class="small muted" style="margin-top:8px">Fixes retirés ce mois : ' + annules.map(function (x) {
      return esc(x.description || lib(x.libelleId).nom) + ' <button class="link small" data-act="restoreOcc" data-id="' + x.id + '">rétablir</button>';
    }).join(' · ') + '</div>';
  }
  return h + '</div>';
}

function recStatus(r) {
  var now = ymNow();
  if (!r.actif) return { txt: 'Arrêté', cls: 'warn', off: true };
  if (r.fin && r.fin < now) return { txt: 'Terminé en ' + monthName(r.fin), cls: 'warn', off: true };
  if (r.debut > now) return { txt: 'Commence en ' + monthName(r.debut), cls: '', off: false };
  return { txt: r.fin ? 'Jusqu\'à ' + monthName(r.fin) : 'Perpétuel', cls: '', off: false };
}

function viewFixes() {
  var h = '';
  var act = D.recurrents.filter(function (r) { return !recStatus(r).off; });
  var e = 0, s = 0;
  act.forEach(function (r) { if (lib(r.libelleId).sens === 'entree') e += +r.montant; else s += +r.montant; });
  h += '<div class="card hero"><div class="label">Solde des mouvements fixes / mois</div>' +
    '<div class="big num ' + (e - s < 0 ? 'bad' : 'good') + '">' + eur(e - s) + '</div>' +
    '<div class="sub"><span>Entrées fixes : <b class="num">' + eur(e) + '</b></span><span>Sorties fixes : <b class="num">' + eur(s) + '</b></span></div></div>';
  h += '<div class="info">Les mouvements fixes sont reportés automatiquement chaque mois jusqu\'à leur échéance. ' +
    'Une modification ici s\'applique aux mois suivants ; pour un seul mois, modifiez le mouvement dans l\'onglet Mouvements.</div>';

  ['entree', 'sortie'].forEach(function (sens) {
    var list = D.recurrents.filter(function (r) { return lib(r.libelleId).sens === sens; })
      .sort(function (a, b) { return (recStatus(a).off - recStatus(b).off) || (lib(a.libelleId).ordre - lib(b.libelleId).ordre) || (b.montant - a.montant); });
    h += '<div class="card"><div class="sec-head"><h2>' + (sens === 'entree' ? '💶 Entrées fixes' : '💸 Sorties fixes') + '</h2>' +
      '<b class="num small">' + eur(sens === 'entree' ? e : s) + '</b></div><ul class="list">';
    list.forEach(function (r) {
      var l = lib(r.libelleId), st = recStatus(r);
      h += '<li class="item ' + (st.off ? 'off' : '') + '" data-act="openRec" data-id="' + r.id + '"><span style="font-size:20px">' + icon(l) + '</span>' +
        '<div class="main"><div class="title">' + esc(r.description || l.nom) + '</div>' +
        '<div class="meta">' + esc(l.nom) + ' · le ' + r.jour + (+r.decalage < 0 ? ' du mois précédent' : '') + ' <span class="tag ' + st.cls + '">' + esc(st.txt) + '</span></div></div>' +

      '<div class="small muted" style="margin-bottom:8px">Une ligne par mouvement : <code>E ou S;Libellé;Description;Montant;Fin (AAAA-MM, vide = perpétuel);Jour</code><br>' +
      'Ex. <code>S;Prêt maison;Crédit Agricole;762,32;;5</code>. Un libellé inconnu est créé automatiquement. Début : mois en cours.</div>' +
      '<textarea id="importTxt" rows="4" placeholder="E;Salaires;Salaire Guillaume;2846,01"></textarea>' +
      '<button class="btn block" style="margin-top:8px" data-act="doImport">Importer</button></div>';
  }
  return h;
}

  });

    '<div class="foot">Budget v' + esc(D.version) + ' · ' + esc(D.stage) + '<br>Sauvegarde automatique à la fermeture de l\'appli et chaque nuit.</div></div>';
  return h;
}
function menuItem(ic, title, meta, target) {

function backbar(title, extra) {

function openSheet(html) {
  closeSheet();
  var o = document.createElement('div');
  o.className = 'overlay'; o.id = 'overlay';
  o.innerHTML = '<div class="sheet">' + html + '</div>';
  o.addEventListener('click', function (e) { if (e.target === o) closeSheet(); });
  document.body.appendChild(o);
}
function closeSheet() { var o = document.getElementById('overlay'); if (o) o.remove(); }
function val(id) { var e = document.getElementById(id); return e ? e.value : ''; }
function checked(id) { var e = document.getElementById(id); return !!(e && e.checked); }
function actions(delAct, delLabel, saveAct, id) {
  return '<div class="actions">' + (delAct ? '<button class="btn danger" data-act="' + delAct + '" data-id="' + esc(id || '') + '">' + delLabel + '</button>'
    : '<button class="btn ghost" data-act="close">Annuler</button>') +
    '<button class="btn" id="saveBtn" data-act="' + saveAct + '" data-id="' + esc(id || '') + '">Enregistrer</button></div>';
}
function busySave(p) {
  var b = document.getElementById('saveBtn'); if (b) b.disabled = true;
  return p.catch(function (e) { var b = document.getElementById('saveBtn'); if (b) b.disabled = false; throw e; });
}
function libChips(sens, selected) {
  var h = '<div class="chips" id="libChips">';
  libsSorted(sens).forEach(function (l) {
    h += '<button type="button" class="chip ' + (l.id === selected ? 'on' : '') + '" data-act="pickLib" data-id="' + l.id + '">' + icon(l) + ' ' + esc(l.nom) + '</button>';
  });
  return h + '<button type="button" class="chip add" data-act="quickLib">＋ Nouveau</button></div>';
}
function finField(prefix, fin) {
  return '<div class="field"><label>Échéance de fin</label>' +
    '<label class="opt"><input type="radio" name="' + prefix + 'fin" value="" ' + (fin ? '' : 'checked') + ' data-act="finMode">Perpétuel</label>' +
    '<label class="opt"><input type="radio" name="' + prefix + 'fin" value="date" ' + (fin ? 'checked' : '') + ' data-act="finMode">Jusqu\'à (dernier mois inclus)</label>' +
    '<input type="month" id="' + prefix + 'finMois" value="' + esc(fin || '') + '" ' + (fin ? '' : 'hidden') + '></div>';
}
function readFin(prefix) {
  var r = document.querySelector('input[name="' + prefix + 'fin"]:checked');
  if (!r || !r.value) return '';
  var m = val(prefix + 'finMois');
  if (!/^\d{4}-\d{2}$/.test(m)) throw new Error('Choisissez le mois de fin');
  return m;
}

/** Remplit « Compte pour le budget de » : mois de la date ±1 ; par défaut selon le libellé. */
function refreshBudgetMonth() {
  var sel = document.getElementById('m_mois');
  if (!sel) return;
  var d = val('m_date');
  var dm = /^\d{4}-\d{2}/.test(d) ? d.substring(0, 7) : mois;
  var current = sel.value || form.moisInit;
  var choices = [shiftMonth(dm, -1), dm, shiftMonth(dm, 1)];
  if (current && choices.indexOf(current) < 0) choices.push(current);
  var def;
  if (form.moisTouched && current) def = current;
  else {
    var l = form.libelleId ? byId(D.libelles, form.libelleId) : null;
    def = l && l.moisSuivant ? shiftMonth(dm, 1) : dm;
  }
  sel.innerHTML = choices.map(function (m) {
    return '<option value="' + m + '" ' + (m === def ? 'selected' : '') + '>' + esc(monthName(m)) + (m === dm ? '' : m < dm ? ' (mois précédent)' : ' (mois suivant)') + '</option>';
  }).join('');
}

function saveMvt(id) {
  var amt = parseAmount(val('m_amt'));
  if (amt === null || amt === 0) return toast('Montant manquant', true);
  if (!form.libelleId) return toast('Choisissez un libellé', true);
  var date = val('m_date');
  if (!date) return toast('Date manquante', true);
  var repeter = null;
  if (!id && checked('m_rep')) {
    try { repeter = { fin: readFin('m_') }; } catch (e) { return toast(e.message, true); }
  }
  var rec = { id: id || '', date: date, mois: val('m_mois'), montant: amt, libelleId: form.libelleId, description: val('m_desc') };
  if (id) rec.pointe = checked('m_pointe');
  form.lastSens = form.sens;
  busySave(write('saveMouvement', rec, repeter)).then(function (res) {
    upsertLocal(D.mouvements, res.mouvement);
    if (res.recurrent) D.recurrents.push(res.recurrent);
    closeSheet();
    if (res.mouvement.mois !== mois) mois = res.mouvement.mois;
    render(); toast(res.recurrent ? 'Mouvement fixe créé' : 'Enregistré');
  });
}

function delMvt(id) {
  var x = byId(D.mouvements, id);
  if (!confirm(x.recurrentId ? 'Retirer ce mouvement fixe pour ' + monthName(x.mois) + ' seulement ?' : 'Supprimer ce mouvement ?')) return;
  write('deleteMouvement', id).then(function () {
    if (x.recurrentId) x.statut = 'annule'; else removeLocal(D.mouvements, id);
    closeSheet(); render(); toast(x.recurrentId ? 'Retiré pour ce mois' : 'Supprimé');
  });
}

function saveRec(id) {
  var amt = parseAmount(val('r_amt'));
  if (amt === null) return toast('Montant manquant', true);
  if (!form.libelleId) return toast('Choisissez un libellé', true);
  var fin;
  try { fin = readFin('r_'); } catch (e) { return toast(e.message, true); }
  var old = id ? byId(D.recurrents, id) : null;
  var rec = { id: id || '', libelleId: form.libelleId, description: val('r_desc'), montant: amt, jour: +val('r_jour') || 1,
    debut: val('r_debut'), fin: fin, actif: true, decalage: checked('r_dec') ? -1 : 0 };
  var from = id ? val('r_from') : rec.debut;
  busySave(write('saveRecurrent', rec, from)).then(function (data) {
    setData(data); closeSheet(); render(); ensureMonthClient(); toast('Mouvement fixe enregistré');
  });
}

function stopRec(id) {
  var from = mois > ymNow() ? mois : ymNow();

  if (!/^\d{4}-\d{2}$/.test(m)) return toast('Format attendu : AAAA-MM', true);
  write('stopRecurrent', id, m).then(function (data) { setData(data); closeSheet(); render(); toast('Mouvement fixe arrêté'); });
}

/* ================================================================== */
/* Actions (délégation d'événements)                                   */
/* ================================================================== */
var ACT = {
  tab: function (d) { tab = d.tab; sub = ''; if (tab !== 'mouvements') mvtFilter = 'tous'; render(); window.scrollTo(0, 0); },
  sub: function (d) { sub = d.sub; if (sub === 'journal') journalCache = null; if (sub === 'backups') backupsCache = null; render(); window.scrollTo(0, 0); },
  prevMonth: function () { mois = shiftMonth(mois, -1); render(); ensureMonthClient(); },
  nextMonth: function () { mois = shiftMonth(mois, 1); render(); ensureMonthClient(); },
  gotoMonth: function (d) { mois = d.m; render(); ensureMonthClient(); },
  refresh: function () { load().then(function () { toast('Données à jour'); }); },
  goFilter: function (d) { tab = 'mouvements'; mvtFilter = d.f; render(); },
  mvtFilter: function (d) { mvtFilter = d.f; render(); },
  close: closeSheet,
  newMvt: function () { openMvt(null); },
  openMvt: function (d) { openMvt(d.id); },
  saveMvt: function (d) { saveMvt(d.id); },
  delMvt: function (d) { delMvt(d.id); },
  restoreOcc: function (d) {
    write('restoreOccurrence', d.id).then(function (m) { upsertLocal(D.mouvements, m); render(); toast('Rétabli'); });
  },
  togglePointe: function (d) {
    var x = byId(D.mouvements, d.id); if (!x) return;
    x.pointe = !x.pointe; render();
    write('setPointe', d.id, x.pointe).catch(function () { x.pointe = !x.pointe; render(); });
  },
  setSens: function (d) {
    form.sens = d.sens; form.libelleId = '';
    Array.prototype.forEach.call(document.querySelectorAll('.sheet .seg button'), function (b) { b.classList.toggle('on', b.dataset.sens === d.sens); });
    document.getElementById('libWrap').innerHTML = libChips(form.sens, '');
  },
  pickLib: function (d) {
    form.libelleId = d.id;
    Array.prototype.forEach.call(document.querySelectorAll('#libChips .chip'), function (b) { b.classList.toggle('on', b.dataset.id === d.id); });
    if (form.kind === 'mvt') refreshBudgetMonth();
    if (form.kind === 'rec' && !form.id) { var c = document.getElementById('r_dec'); var l = byId(D.libelles, d.id); if (c && l) c.checked = !!l.moisSuivant; }
  },
  quickLib: function () {
    var nom = prompt('Nom du nouveau libellé (' + (form.sens === 'entree' ? 'entrée' : 'sortie') + ') :');
    if (!nom || !nom.trim()) return;
    write('saveLibelle', { nom: nom, sens: form.sens, groupe: form.sens === 'entree' ? 'Entrées' : 'Vie courante', budget: 0 }).then(function (l) {
      D.libelles.push(l); form.libelleId = l.id;
      var w = document.getElementById('libWrap'); if (w) w.innerHTML = libChips(form.sens, l.id);
      toast('Libellé « ' + l.nom + ' » créé');
    });
  },
  toggleRep: function () { document.getElementById('repBox').hidden = !checked('m_rep'); },
  finMode: function (d, el) {
    var prefix = el.name.replace(/fin$/, '');
    document.getElementById(prefix + 'finMois').hidden = el.value !== 'date';
  },
  newRec: function (d) { openRec(null, d.sens); },
  openRec: function (d) { openRec(d.id); },
  saveRec: function (d) { saveRec(d.id); },
  stopRec: function (d) { stopRec(d.id); },
  doImport: function () {
    var t = val('importTxt'); if (!t.trim()) return;
    write('importRecurrents', t).then(function (res) {
      setData(res.data); render();
      toast(res.count + ' importé(s)' + (res.skipped.length ? ', ' + res.skipped.length + ' ligne(s) ignorée(s)' : ''), !!res.skipped.length);
    });
  },
  openLib: function (d) { openLib(d.id); },
  saveLib: function (d) { saveLib(d.id); },
  delLib: function (d) { delLib(d.id); },
  openUser: function (d) { openUser(d.email); },
  saveUserForm: function (d) { saveUserForm(d.id); },
  pickColor: function (d) {
    form.couleur = d.c; document.getElementById('u_color').value = d.c;
    Array.prototype.forEach.call(document.querySelectorAll('#swatches button'), function (b) { b.classList.toggle('on', b.dataset.c === d.c); });
  },
  openAttente: function (d) { openAttente(d.id); },
  saveAttente: function (d) { saveAttenteForm(d.id); },
  delAttente: function (d) { write('deleteAttente', d.id).then(function () { removeLocal(D.attente, d.id); closeSheet(); render(); }); },
  openEpargne: function (d) { openEpargne(d.id); },
  saveEpargne: function (d) { saveEpargneForm(d.id); },
  delEpargne: function (d) {
    if (!confirm('Supprimer ce compte ?')) return;
    write('deleteEpargne', d.id).then(function () { removeLocal(D.epargne, d.id); closeSheet(); render(); });
  },
  loadJournal: function () { journalCache = null; render(); },
  backupNow: function () {
    call('backupNow').then(function (b) { D.lastBackup = b.horodatage; dirty = false; backupsCache = null; render(); toast('Sauvegarde effectuée'); });
  },
  restore: function (d) {
    if (!confirm('Restaurer la sauvegarde du ' + d.label + ' ?\nL\'état actuel sera d\'abord sauvegardé.')) return;
    call('restoreBackup', d.id).then(function (data) { setData(data); backupsCache = null; render(); toast('Sauvegarde restaurée'); });
  }
};

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var a = ACT[el.dataset.act];
  if (!a) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  e.stopPropagation();
  a(el.dataset, el);
});
document.addEventListener('input', function (e) {
  var k = e.target.dataset && e.target.dataset.input;
  if (k === 'descAuto') {
    var id = form.descs && form.descs[e.target.value];
    var l = id && byId(D.libelles, id);
    if (l && l.actif) {
      if (l.sens !== form.sens) ACT.setSens({ sens: l.sens });
      ACT.pickLib({ id: l.id });
    }
  } else if (k === 'dateChange') {
    refreshBudgetMonth();
  } else if (k === 'moisTouched') {
    form.moisTouched = true;
  } else if (k === 'colorInput') {
    form.couleur = e.target.value;
  }
});

/* ================================================================== */
/* Sauvegarde à la fermeture + actualisation au retour                 */
/* ================================================================== */
function backupOnLeave() {
  if (!D || !canEdit() || !dirty) return;
  dirty = false;
  try { google.script.run.withFailureHandler(function () { dirty = true; }).autoBackup(); } catch (e) {}
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') {
    backupOnLeave();
  } else if (D && Date.now() - lastLoad > 30000 && !document.getElementById('overlay')) {
    load();
  }
});
window.addEventListener('pagehide', backupOnLeave);

var toastTimer;
function toast(msg, err) {
  var t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, err ? 4000 : 2000);
}

load();
</script>
</body>
</html>
