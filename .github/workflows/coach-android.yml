name: Coach IA (Android)

on:
  push:
    paths:
      - "android-coach/**"
      - ".github/workflows/coach-android.yml"
  pull_request:
    paths:
      - "android-coach/**"
      - ".github/workflows/coach-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-coach
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests du cœur (IA, Strava, charge d'entraînement)
        run: ./gradlew :core:test --stacktrace

      - name: Compilation de l'APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Renommage
        run: cp app/build/outputs/apk/debug/app-debug.apk coach-ia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: coach-ia-apk
          path: android-coach/coach-ia.apk

      - name: Publication (téléchargement direct depuis le téléphone)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: coach-ia-latest
          name: Coach IA (dernière version)
          prerelease: true
          make_latest: false
          body: |
            APK de l'appli Coach IA, compilé depuis la branche `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Sur le téléphone : télécharge `coach-ia.apk`, ouvre-le et autorise l'installation depuis cette source.
          files: android-coach/coach-ia.apk
